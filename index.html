    <div class="sec-h"><h2>Перекусы на замену</h2><span class="lbl">${PLAN.snacks.length} вариантов</span></div>
    <p class="lead" style="margin-bottom:14px">Любой перекус в меню меняется на любой отсюда с похожей калорийностью. Порции женские; ему — на четверть больше либо плюс половина белкового блока.</p>
    <div class="grid g2">${PLAN.snacks.map(x=>smallCard(x,'tg-sn','Перекус')).join('')}</div>
  </div>
  <div class="card sec">
    <div class="sec-h"><h2>Сладкое: слот до 100 ккал</h2><span class="lbl">один пункт в день, обоим</span></div>
    <p class="lead" style="margin-bottom:14px">Это не награда и не исключение, а заложенная строка бюджета — без неё планы на дефиците ломаются недели через три.</p>
    <div class="grid g3">${PLAN.sweets.map(x=>smallCard(x,'tg-sw','Сладкое')).join('')}</div>
  </div>`;
}

function pageCook(){
  return `<div class="card sec">
    <div class="sec-h"><h2>График готовки</h2><span class="lbl">активное время у плиты</span></div>
    <p class="lead" style="margin-bottom:14px">Мультиварка, духовка и хлебопечка работают без вас, поэтому воскресные три с половиной часа — это фон, а не вахта.</p>
    <div class="cook-l">${COOK.map(([d,s,t,key,txt])=>
      `<div class="cook-i${key?' key':''}"><span class="dd">${d}<small>${s}</small></span>
       <p>${txt}<br><span class="num" style="font-size:11px;color:var(--ink3)">${t} активных</span></p></div>`).join('')}</div>
  </div>`;
}

function pageShop(){
  return `<div class="grid g2" style="gap:14px">${SHOP.map(([t,w,groups],ci)=>`
    <div class="card sec">
      <div class="sec-h"><h2>${t}</h2></div>
      <p class="lead" style="font-size:12.5px">${w}</p>
      <div class="shopg">${groups.map(([g,items])=>
        `<span class="lbl">${g}</span>` + items.map(([n,a])=>{
          const id=`s${ci}_${g}_${n}`.replace(/[^\wа-яА-Я]/g,'');
          return `<label><input type="checkbox" data-k="${id}"${checked[id]?' checked':''}><span>${esc(n)}</span><span class="amt">${esc(a)}</span></label>`;
        }).join('')).join('')}</div>
    </div>`).join('')}</div>`;
}

function pageNotes(){
  return `<div class="card sec">
    <div class="sec-h"><h2>Что подкрутить и на что смотреть</h2></div>
    <div class="callout"><b>Дефицит опущен, но не одинаково.</b> Правильный ход был не «резать сильнее», а честнее оценить поддержку: коэффициент активности снижен с 1,45 до 1,375, обе поддержки упали примерно на 110 ккал. Дальше пути расходятся — 23% против 12%, в зависимости от того, есть ли запас жировой массы. Любой расчёт поддержки это гипотеза с разбросом ±15%, поэтому через две-три недели цифры правятся по весам, а не по формуле.</div>
    <div class="notes">${NOTES.map(([t,p])=>`<div class="note-c"><h4>${t}</h4><p>${p}</p></div>`).join('')}</div>
  </div>`;
}

function rail(){
  const d=PLAN.days[TODAY];
  const top=[...PLAN.snacks].sort((a,b)=>density(b.p,b.k)-density(a.p,a.k)).slice(0,4);
  return `
  <div class="card sec">
    <div class="sec-h"><h2>Сегодня в плане</h2><span class="lbl">${esc(d.name)}</span></div>
    <div class="mini">${d.meals.slice(0,4).map((m,mi)=>{
      const V=mealView(TODAY,mi), v=V.skip?V.plan:V.v;
      return `<div class="mini-row">${donut(v.p,v.f,v.c,34,6)}
        <span><h5>${esc(V.title)}</h5><span class="s">${(TAGN[V.label]||V.label)}${V.skip?' · пропущен':V.swapped?' · замена':''}</span></span>
        <span class="kk">${V.skip?'—':nf(v.k)}</span></div>`;
    }).join('')}</div>
  </div>
  <div class="card sec">
    <div class="sec-h"><h2>Самые белковые перекусы</h2></div>
    <div class="mini">${top.map(x=>
      `<div class="mini-row">${donut(x.p,x.f,x.c,34,6)}
        <span><h5>${esc(x.title)}</h5><span class="s">${density(x.p,x.k).toFixed(1)} г белка на 100 ккал</span></span>
        <span class="kk">${x.k}</span></div>`).join('')}</div>
  </div>
  <div class="card sec">
    <div class="sec-h"><h2>Ближайшая закладка</h2></div>
    <div class="cook-l">${COOK.slice(0,3).map(([dd,s,t,key,txt])=>
      `<div class="cook-i"><span class="dd">${dd}<small>${s}</small></span><p>${txt}</p></div>`).join('')}</div>
  </div>`;
}

const RENDER = {home:pageHome, week:pageWeek, pair:pagePair, cons:pageCons, profile:pageProfile, drinks:pageDrinks, recipes:pageRecipes, snacks:pageSnacks, cook:pageCook, shop:pageShop, notes:pageNotes};

function render(){
  renderNav(); renderWho();
  const title = PAGES.find(p=>p[0]===page)[1];
  document.getElementById('pgTitle').textContent = title;
  document.getElementById('pgSub').textContent = SUBS[page];
  const P=person(who);
  document.getElementById('pgBadge').textContent = `${P.name} · ${nf(P.kcal)} ккал/день`;
  const inSearch = query.trim().length > 0;
  if(inSearch){
    document.getElementById('pgTitle').textContent = 'Поиск';
    document.getElementById('pgSub').textContent = 'Совпадения по всему плану: меню, рецепты, перекусы, покупки';
  }
  document.getElementById('pages').innerHTML = `<div class="main" style="gap:14px">${inSearch ? pageSearch() : RENDER[page]()}</div>`;
  const clr = document.getElementById('qClear');
  if(clr) clr.hidden = !inSearch;
  document.getElementById('rail').innerHTML = rail();
}

document.addEventListener('click', e=>{
  typed = null;                       /* ушли из поля — снова показываем счёт */
  const nb = e.target.closest('#nav button');
  if(nb){ page = nb.dataset.page; syncNote = ''; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const sy = e.target.closest('[data-sync]');
  if(sy){
    const di = +sy.dataset.sync, r = syncDay(di);
    const P = person(r.dst), t = dayTotals(di, r.dst);
    const nn = r.moved === 1 ? 'блюдо' : r.moved < 5 ? 'блюда' : 'блюд';
    syncNote = r.moved
      ? 'Перенесено ' + r.moved + ' ' + nn + (r.cleared ? ', ещё ' + r.cleared + ' вернулось к плану' : '') +
        (r.skips ? ', пропуски тоже перенесены' : '') +
        '. У ' + AT[r.dst] + ' теперь тот же состав, а навеска пересчитана под ' + POSS[r.dst] + ' норму: ' + nf(t.k) + ' ккал за день.'
      : 'Замен в этом дне нет — день у ' + AT[r.dst] + ' вернулся к плану' + (r.skips ? ', пропуски перенесены' : '') + ': ' + nf(t.k) + ' ккал.';
    render(); return;
  }
  const gt = e.target.closest('[data-goto]');
  if(gt){ page = gt.dataset.goto; clearQuery(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const sb = e.target.closest('[data-who]');
  if(sb){ who = sb.dataset.who; store.set('kotel.who',who); render(); return; }
  const gr = e.target.closest('[data-g]');
  if(gr){
    const [i,op] = gr.dataset.g.split(':');
    const idx = +i, item = built[idx];
    if(item){
      const f = FOOD[item.n], step = f.unit || (item.g > 60 ? 10 : 5);
      if(op === 'x') built.splice(idx,1);
      else if(op === '+') item.g += step;
      else item.g = Math.max(f.unit || 5, item.g - step);
    }
    render(); return;
  }
  if(e.target.closest('#dr_save')){ saveDrinks(); return; }
  if(e.target.closest('#dr_clear')){
    const pr = profiles[who] || {};
    delete pr.drinks; profiles[who] = pr; store.set('kotel.profiles', profiles); render(); return;
  }
  if(e.target.closest('#pf_save')){ saveProfile(); return; }
  if(e.target.closest('#pf_reset')){ delete profiles[who]; store.set('kotel.profiles', profiles); render(); return; }
  if(e.target.closest('#addFood')){ showForm = true; formMsg = ''; render(); return; }
  if(e.target.closest('#cancelFood')){ showForm = false; formMsg = ''; render(); return; }
  if(e.target.closest('#saveFood')){ saveFood(); return; }
  const rm = e.target.closest('[data-rmfood]');
  if(rm){
    const n = rm.dataset.rmfood;
    custom = custom.filter(f => f.n !== n);
    delete pantry[n];
    built = built.filter(x => x.n !== n);
    purgeFood(n);
    store.set('kotel.custom', custom); store.set('kotel.pantry', pantry);
    rebuildFood(); render(); return;
  }
  if(e.target.closest('#doBuild')){
    consNote = '';
    const r = assembleDish(aimMeal, e.target.closest('#doBuild').dataset.tpl || null);
    built = r ? r.items : [];
    builtTpl = r ? r.tpl : null;
    if(!r) consNote = 'Из отмеченных продуктов не собирается ни одно блюдо для этого приёма. Отметьте больше — хотя бы мясо или творог, овощ и гарнир.';
    render(); return;
  }
  const ed = e.target.closest('[data-edit]');
  if(ed){
    const k = ed.dataset.edit;
    if(editKey === k){ editKey = null; editDraft = null; }
    else { const [a, b] = k.split('.').map(Number); editOpen(a, b); openSwap = null; }
    render(); return;
  }
  const eo = e.target.closest('[data-edoff]');
  if(eo && editDraft){
    const i = +eo.dataset.edoff;
    editDraft[i].off = !editDraft[i].off;
    render(); return;
  }
  const es = e.target.closest('[data-edsave]');
  if(es){ const [a, b] = es.dataset.edsave.split('.').map(Number); editSave(a, b); render(); return; }
  if(e.target.closest('[data-edclose]')){ editKey = null; editDraft = null; render(); return; }
  const ea = e.target.closest('[data-edadd]');
  if(ea && editDraft){
    const n = ea.dataset.edadd;
    if(!editDraft.some(x => x.n === n)) editDraft.push({ n, g: defG(n), off:false });
    render(); return;
  }
  const skb = e.target.closest('[data-skip]');
  if(skb){
    const [a, b] = skb.dataset.skip.split('.').map(Number);
    toggleSkip(a, b);
    editKey = null; editDraft = null; openSwap = null;
    render(); return;
  }
  const re = e.target.closest('[data-recedit]');
  if(re){
    const k = re.dataset.recedit;
    if(recKey === k){ recKey = null; recDraft = null; }
    else {
      const r = RECIPE[k];
      recKey = k; recQ = '';
      recDraft = { ing: r.ing.map(x => ({ n:x.n, g:x.g })), outG: r.outG };
    }
    render(); return;
  }
  const rgo = e.target.closest('[data-rgoff]');
  if(rgo && recDraft){ recDraft.ing.splice(+rgo.dataset.rgoff, 1); render(); return; }
  const rad = e.target.closest('[data-recadd]');
  if(rad && recDraft){
    const n = rad.dataset.recadd;
    if(!recDraft.ing.some(x => x.n === n)) recDraft.ing.push({ n, g: defG(n) });
    render(); return;
  }
  if(e.target.closest('[data-recsave]') && recDraft && recKey){ saveRecipe(); render(); return; }
  if(e.target.closest('[data-recclose]')){ recKey = null; recDraft = null; render(); return; }
  const rrs = e.target.closest('[data-recreset]');
  if(rrs){
    delete recEdit[rrs.dataset.recreset];
    store.set('kotel.recipes', recEdit);
    rebuildRecipes();
    recKey = null; recDraft = null;
    render(); return;
  }
  const sdh = e.target.closest('[data-swapdish]');
  if(sdh){
    const [d0, m0, id] = sdh.dataset.swapdish.split('.');
    const di0 = +d0, mi0 = +m0, meal = PLAN.days[di0].meals[mi0];
    const lab = (meal.label === 'Вечер' || meal.label === 'Перекус') ? 'Перекус' : meal.label;
    const aim = { k: meal[who].k, p: meal[who].p };
    let best = null;
    for(let t = 0; t < 40; t++){
      const r = assembleDish(lab, id, aim);
      if(!r) continue;
      const v = sumOf(r.items), miss = Math.abs(v.k - aim.k) / aim.k;
      if(!best || miss < best.miss) best = { r, miss };
      if(miss < 0.05) break;
    }
    if(best){
      const st = stepsFor(best.r.tpl, best.r.items);
      applySwap(di0, mi0, {
        title: st && !st.broken ? cap(st.title) : best.r.tpl.short,
        tplId: best.r.tpl.id,
        items: best.r.items.map(x => ({ n:x.n, g:x.g, r:x.r, side:!!x.side }))
      });
      openSwap = null; swapQ = '';
    }
    render(); return;
  }
  const sb2 = e.target.closest('[data-swap]');
  if(sb2){ const k = sb2.dataset.swap; swapQ = ''; openSwap = openSwap === k ? null : k; render(); return; }
  if(e.target.closest('[data-swapclose]')){ openSwap = null; render(); return; }
  const un = e.target.closest('[data-undo]');
  if(un){ const [di,mi] = un.dataset.undo.split('.').map(Number); dropSwap(di,mi); openSwap = null; render(); return; }
  const ap = e.target.closest('[data-apply]');
  if(ap){
    const d = JSON.parse(ap.dataset.apply);
    applySwap(d.di, d.mi, { title:d.title, tplId:d.tplId || null, items:d.items });
    render(); return;
  }
  const dp = e.target.closest('[data-dish]');
  if(dp){
    consNote = '';
    const r = assembleDish(aimMeal, dp.dataset.dish);
    built = r ? r.items : [];
    builtTpl = r ? r.tpl : null;
    if(!r) consNote = 'Для этого блюда не хватает продуктов в кладовке.';
    render(); return;
  }
  if(e.target.id === 'doClear'){ built = []; builtTpl = null; consNote = ''; render(); return; }
  const gd = e.target.closest('[data-gym]');
  if(gd){ const i = +gd.dataset.gym; setGym(i, !isGym(i)); render(); return; }
  const et = e.target.closest('[data-eat]');
  if(et){ markDay(day, et.dataset.eat || null, 0); render(); return; }
  if(e.target.closest('#eat_save')){
    const el = document.getElementById('eat_k');
    const v = el ? parseFloat(String(el.value).replace(',', '.')) : 0;
    markDay(day, 'off', isNaN(v) ? 0 : v);
    render(); return;
  }
  if(e.target.closest('#outSkip')){ outNote = null; render(); return; }
  const rbd = e.target.closest('[data-rebuild]');
  if(rbd){
    const n = rbd.dataset.rebuild, r = rebuildWithout(n, who);
    consNote = r.done
      ? 'Пересобрано ' + r.done + ' ' + (r.done === 1 ? 'приём' : r.done < 5 ? 'приёма' : 'приёмов') + ' без «' + word(n) + '»' +
        (r.kept ? ', ещё ' + r.kept + ' оставил как есть — из того, что дома, равного не собралось' : '') +
        '. Замены видны в «Неделе», вернуть можно кнопкой «Вернуть как в плане».'
      : 'Из того, что осталось дома, замену собрать не вышло. Отметьте ещё продукты в кладовке и попробуйте снова.';
    outNote = null;
    render(); return;
  }
  if(e.target.closest('#doProt')){ addProtein(); return; }
  if(e.target.closest('#doPair')){ consPair = !consPair; store.set('kotel.conspair', consPair); render(); return; }
  if(e.target.closest('#doX2')){ cookX2 = !cookX2; store.set('kotel.cookx2', cookX2); render(); return; }
  const tb = e.target.closest('[data-theme-set]');
  if(tb){ theme = tb.dataset.themeSet; store.set('kotel.theme',theme); applyTheme(); return; }
  const gb = e.target.closest('[data-go]');
  if(gb){ page = gb.dataset.go; clearQuery(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const rmeal = e.target.closest('[data-recmeal]');
  if(rmeal){ recMeal = rmeal.dataset.recmeal; render(); return; }
  const ck = e.target.closest('[data-cook]');
  if(ck){
    const t = dishById(ck.dataset.cook);
    if(t){
      aimMeal = t.meals[0];
      consNote = '';
      const r = assembleDish(aimMeal, t.id);
      built = r ? r.items : [];
      builtTpl = r ? r.tpl : null;
      if(!r) consNote = 'Для этого блюда не хватает продуктов в кладовке — отметьте недостающее справа.';
      page = 'cons';
      render(); window.scrollTo({top:0, behavior:'smooth'});
    }
    return;
  }
  const rb = e.target.closest('[data-recipe]');
  if(rb){ openRec = +rb.dataset.recipe; page = 'recipes'; clearQuery(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const db = e.target.closest('[data-day]');
  if(db){ day = +db.dataset.day; if(page !== 'pair') page = 'week'; clearQuery(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
});
function clearQuery(){
  query = '';
  const i = document.getElementById('q');
  if(i) i.value = '';
}
document.addEventListener('input', e=>{
  if(e.target.id === 'q'){ query = e.target.value; render(); }
  if(/^cg_\d+$/.test(e.target.id)){
    const i = +e.target.id.slice(3), it = built[i];
    if(it){
      const f = FOOD[it.n];
      it.g = Math.round(numField(e.target) * ((f && f.unit) || 1));
      keepCaret(e.target);
    }
    return;
  }
  if(/^ed_\d+$/.test(e.target.id) && editDraft){
    const i = +e.target.id.slice(3);
    editDraft[i].g = Math.round(numField(e.target) * stepOf(editDraft[i].n));
    keepCaret(e.target);
    return;
  }
  if(/^rg_\d+$/.test(e.target.id) && recDraft){
    const i = +e.target.id.slice(3), it = recDraft.ing[i];
    if(it){
      it.g = Math.round(numField(e.target) * stepOf(it.n));
      keepCaret(e.target);
    }
    return;
  }
  if(e.target.id === 'rout' && recDraft){
    recDraft.outG = Math.round(numField(e.target));
    keepCaret(e.target);
    return;
  }
  if(e.target.id === 'rq'){ recQ = e.target.value; keepCaret(e.target); return; }
  if(e.target.id === 'edq'){ edQ = e.target.value; keepCaret(e.target); return; }
  if(e.target.id === 'swq'){ swapQ = e.target.value; keepCaret(e.target); }
});
document.addEventListener('change', e=>{
  if(typed && typed.id === e.target.id) typed = null;
  if(e.target.id === 'aimSel'){ aimMeal = e.target.value; consNote = ''; render(); return; }
  if(e.target.id === 'baseSel' && e.target.value){
    const [di,mi] = e.target.value.split('.').map(Number);
    const r = fromMeal(di,mi);
    built = r.parts; builtTpl = null;
    consNote = r.parts.length
      ? (r.unknown ? `«${r.title}»: ${r.unknown} из компонентов — готовое блюдо, его КБЖУ смотрите в рецептах. Остальное можно править здесь.` : '')
      : `«${r.title}» собран из готового блюда, а конструктор работает с сырыми продуктами. Откройте раздел «Рецепты», чтобы поменять навеску там.`;
    render(); return;
  }
  const fd = e.target.closest('[data-food]');
  if(fd){
    const n = fd.dataset.food;
    pantry[n] = fd.checked;
    store.set('kotel.pantry', pantry);
    /* сняли галочку — посмотрим, не стоит ли этот продукт в меню недели */
    if(!fd.checked){
      const hits = mealsUsing(n, who).filter(h => h.label !== 'Вечер');
      outNote = hits.length ? { n, count: hits.length } : null;
    } else if(outNote && outNote.n === n) outNote = null;
    render();
  }
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && query){ clearQuery(); render(); document.getElementById('q').blur(); }
  if(e.key === '/' && document.activeElement.id !== 'q'){ e.preventDefault(); document.getElementById('q').focus(); }
});
document.addEventListener('change', e=>{
  const cb = e.target.closest('.shopg input');
  if(cb){ checked[cb.dataset.k] = cb.checked; store.set('kotel.shop',checked); }
});
applyTheme();
render();
</script>
