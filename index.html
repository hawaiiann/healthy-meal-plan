function slotPool(sl){
  let pool = allFoods().filter(f => pantry[f.n]);
  if(sl.only) pool = pool.filter(f => sl.only.indexOf(f.n) >= 0);
  if(sl.cat)  pool = pool.filter(f => f.cat === sl.cat);
  if(sl.not)  pool = pool.filter(f => sl.not.indexOf(f.n) < 0);
  return pool;
}
const dishFits = t => t.slots.every(sl => !sl.req || slotPool(sl).length > 0);

/* Минимальная калорийность блюда: обязательные роли на нижней границе
   навески, самым лёгким из доступных продуктов. Сырники физически не
   влезают в перекус на 170 ккал — их не надо и предлагать. */
function minKcal(t){
  let sum = 0;
  for(const sl of t.slots){
    const pool = slotPool(sl);
    if(!pool.length){ if(sl.req) return Infinity; continue; }
    let best = Infinity;
    for(const f of pool){
      const g = f.unit ? Math.max(f.unit, sl.lo || 5) : (sl.lo || 5);
      best = Math.min(best, f.k * g / 100);
    }
    sum += best;
  }
  return sum;
}
function dishesFor(meal, aimK){
  const ceil = (aimK || aimFor(meal).k) * 1.05;
  return DISHES.filter(t => t.meals.indexOf(meal) >= 0 && dishFits(t) && minKcal(t) <= ceil);
}

/* Подгонка калорий: на каждом проходе делаем один шаг — тот, что сильнее
   приближает к цели. Шаг «первый подходящий» застревал на штучных
   продуктах, где яйцу нужно было полштуки. */
function fitKcal(list, target, tol){
  const t = tol || 0.04;
  for(let pass = 0; pass < 10; pass++){
    const cur = sumOf(list).k, diff = target - cur;
    if(Math.abs(diff) <= target * t) break;
    let best = null;
    for(const it of list){
      if(!it.flex) continue;
      const f = FOOD[it.n];
      if(!f || f.k <= 0) continue;
      const ng = roundG(f, Math.min(Math.max(it.g + diff / (f.k / 100), it.lo), it.hi));
      if(ng === it.g) continue;
      const after = Math.abs(target - (cur + f.k * (ng - it.g) / 100));
      if(after < Math.abs(diff) - 1 && (!best || after < best.d)) best = { it, ng, d: after };
    }
    if(!best) break;
    best.it.g = best.ng;
  }
}

/* Образец блюда для каталога рецептов. В отличие от сборки в конструкторе
   берёт продукты из всей базы, а не из кладовки, и выбирает их без случайности —
   чтобы список не перетасовывался при каждой перерисовке. */
function previewDish(tpl){
  const meal = tpl.meals[0], aim = aimFor(meal), parts = [];
  for(const sl of tpl.slots){
    let pool = allFoods();
    if(sl.only) pool = pool.filter(f => sl.only.indexOf(f.n) >= 0);
    if(sl.cat)  pool = pool.filter(f => f.cat === sl.cat);
    if(sl.not)  pool = pool.filter(f => sl.not.indexOf(f.n) < 0);
    if(!pool.length){ if(sl.req) return null; continue; }
    const f = pool[0];
    if(parts.some(x => x.n === f.n)) continue;
    parts.push({ n:f.n, g:roundG(f, sl.base), r:sl.r, lo:sl.lo || 5, hi:sl.hi || 260, flex:!!sl.flex });
  }
  if(!tpl.slots.every(sl => !sl.req || parts.some(x => x.r === sl.r))) return null;
  fitAim(parts, aim.k, aim.p);
  return { parts, aim, meal, v: sumOf(parts) };
}

function assembleDish(meal, wantId, aimOverride){
  const aim = aimOverride || aimFor(meal);
  const cands = wantId ? DISHES.filter(t => t.id === wantId && dishFits(t)) : dishesFor(meal, aim.k);
  if(!cands.length) return null;
  const t = pick(cands);
  const parts = [];
  for(const sl of t.slots){
    const pool = slotPool(sl);
    if(!pool.length){ if(sl.req) return null; continue; }
    /* В белковой роли из двух случайных берём более белковый на калорию:
       разнообразие остаётся, но яйцо не вытесняет творог там, где до нормы
       белка не хватает восьми граммов. */
    const dense = (sl.r === 'main' || sl.r === 'curd' || sl.r === 'prot');
    let f = pick(pool);
    if(dense && pool.length > 1){
      const g2 = pick(pool);
      if(g2 && g2.k > 0 && f.k > 0 && g2.p / g2.k > f.p / f.k) f = g2;
    }
    if(parts.some(x => x.n === f.n)) continue;          // один продукт в двух ролях не нужен
    parts.push({ n:f.n, g:roundG(f, sl.base), r:sl.r, lo:sl.lo || 5, hi:sl.hi || 260, flex:!!sl.flex });
  }
  if(!t.slots.every(sl => !sl.req || parts.some(x => x.r === sl.r))) return null;

  /* главный компонент задаёт белок, остальное подгоняется по калориям */
  const mainIt = parts.find(x => x.r === 'main' || x.r === 'curd' || x.r === 'prot');
  if(mainIt){
    const f = FOOD[mainIt.n];
    if(f.p > 0){
      const gp = Math.min(aim.p * 0.95 / (f.p / 100), aim.k * 0.65 / (f.k / 100));
      mainIt.g = roundG(f, Math.min(Math.max(gp, mainIt.lo), mainIt.hi));
      if(f.p >= 5) mainIt.hi = Math.max(mainIt.g, roundG(f, aim.p * 1.25 / (f.p / 100)));
    }
  }
  fitAim(parts, aim.k, aim.p);

  /* Перебор по белку ловим по факту, а не по имени роли: в смузи-боуле его
     несут и творог, и протеин, и вместе они давали 52 г при цели 31. */
  for(let guard = 0; guard < 4; guard++){
    const tot = sumOf(parts);
    if(tot.p <= aim.p * 1.5) break;
    let top = null;
    for(const x of parts){
      if(!x.flex) continue;
      const f = FOOD[x.n], pg = f.p * x.g / 100;
      if(f.p > 0 && (!top || pg > top.pg)) top = { x, pg, f };
    }
    if(!top) break;
    const ng = roundG(top.f, Math.max(top.x.lo, top.x.g - (tot.p - aim.p * 1.3) / (top.f.p / 100)));
    if(ng >= top.x.g) break;
    top.x.g = ng;
    top.x.hi = ng;            // иначе подбор калорий тут же вернёт его обратно
    fitAim(parts, aim.k, aim.p);
  }

  /* Перебор даже на минимуме — снимаем необязательные компоненты, начиная
     с самого калорийного. Иначе на сладкое в 90 ккал предлагалось джелато
     с бананом и протеином на 167. */
  for(let guard = 0; guard < 4; guard++){
    if(sumOf(parts).k - aim.k <= aim.k * 0.08) break;
    const optional = parts.filter(x => !t.slots.some(sl => sl.r === x.r && sl.req));
    if(!optional.length) break;
    let worst = null;
    for(const x of optional){
      const k = FOOD[x.n].k * x.g / 100;
      if(!worst || k > worst.k) worst = { x, k };
    }
    parts.splice(parts.indexOf(worst.x), 1);
    fitAim(parts, aim.k, aim.p);
  }

  /* вприкуску: то, что не влезло в блюдо, но нужно по калориям */
  const side = [];
  const rest = aim.k - sumOf(parts).k;
  if(rest >= 60){
    const ok = sideList(t);
    const pool = allFoods().filter(f => pantry[f.n] && ok.indexOf(f.n) >= 0 && !parts.some(x => x.n === f.n));
    if(pool.length){
      const f = pick(pool);
      side.push({ n:f.n, g:roundG(f, Math.min(Math.max(rest / (f.k / 100), f.unit || 10), 130)),
                  r:'side', lo:f.unit || 5, hi:150, flex:true, side:true });
      fitAim(parts.concat(side), aim.k, aim.p);
    }
  }
  return { tpl:t, items: parts.concat(side) };
}

/* шаги готовки по текущему составу — пересчитываются после ручных правок */
function stepsFor(tpl, items){
  if(!tpl) return null;
  const S = {};
  for(const x of items) if(x.r && !x.side) S[x.r] = x;
  if(tpl.slots.filter(sl => sl.req && !S[sl.r]).length) return { broken:true };
  try { return { title: tpl.title.replace(/\{(\w+)(?::(\d))?\}/g, (_, r, c) => S[r] ? word(S[r].n, c ? +c : 0) : ''), steps: tpl.steps(S) }; }
  catch(e){ return { broken:true }; }
}
/* В кладовке лежат «макароны гот.», а варить придётся сухие: их вдвое с
   лишним меньше по весу. Показываем в шагах именно сухую навеску. */
const dry = x => {
  if(!x) return '';
  const f = FOOD[x.n], d = anyFood('макароны тв. сухие');
  if(!f || !d || !d.k) return gOf(x);
  return Math.round(f.k * x.g / d.k / 5) * 5 + ' г';
};
const dishById = id => DISHES.find(t => t.id === id) || null;
function dishSteps(){ return builtTpl ? stepsFor(builtTpl, built) : null; }

/* Тот же состав, но под вторую норму. Состав не трогаем — сковорода одна,
   меняется только навеска. Границы берём от текущих грамм, а не от шаблона:
   если навеску правили руками, вторая порция должна идти следом. */
function twinOf(items, targetK){
  const cur = sumOf(items).k, mul = cur > 0 ? targetK / cur : 1;
  const t = items.map(x => {
    const fo = FOOD[x.n], g = roundG(fo, x.g * mul);
    let lo = roundG(fo, g * 0.7), hi = roundG(fo, g * 1.3);
    /* меньшая порция нигде не больше большей: округление до 5 г и до целых
       штук иначе выдаёт «ей два хлебца, ему один» на мелких позициях */
    if(mul < 1) hi = Math.min(hi, x.g); else lo = Math.max(lo, x.g);
    return { n:x.n, r:x.r, side:x.side, g, flex:true,
             lo: Math.min(lo, g), hi: Math.max(hi, g) };
  });
  fitKcal(t, targetK);
  return t;
}
/* сборка глазами обоих: общий вес, деление по тарелкам и шаги на всё сразу */
function consPairView(){
  if(!built.length) return null;
  const other = who === 'm' ? 'w' : 'm';
  const mine = built.map(x => ({ n:x.n, r:x.r, side:x.side, g:x.g }));
  const theirs = twinOf(built, aimFor(aimMeal, other).k);
  const A = who === 'm' ? mine : theirs, B = who === 'm' ? theirs : mine;
  const map = new Map();
  const add = (list, key) => list.forEach(x => {
    const e = map.get(x.n) || { n:x.n, m:0, w:0 };
    e[key] += x.g; map.set(x.n, e);
  });
  add(A, 'm'); add(B, 'w');
  const rows = Array.from(map.values()).map(e => Object.assign(e, { g: e.m + e.w }));
  const total = A.map((x, i) => Object.assign({}, x, { g: x.g + (B[i] ? B[i].g : 0) }));
  const vm = sumOf(A), vw = sumOf(B), pm = plateOf(A), pw = plateOf(B);
  const k = MUL();
  const st = builtTpl ? stepsFor(builtTpl, total.map(x => Object.assign({}, x, { g: x.g * k }))) : null;
  return { rows, total, vm, vw, pm, pw, other,
           aimM: aimFor(aimMeal, 'm'), aimW: aimFor(aimMeal, 'w'),
           steps: st && !st.broken ? st : null };
}

/* ================= замены в дне =================
   План — не приговор: если продукта нет или блюдо надоело, приём меняется
   на равный по калориям и белку. Замена живёт в браузере и отдельная
   для каждого человека — порции у них разные. */

const swapKey = (di, mi, k) => (k || who) + '|' + PLAN.days[di].id + '.' + mi;

function parseQty(text){
  return String(text).split(', ').map(t => {
    const mm = t.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(г|шт)$/);
    if(!mm) return null;
    const f = FOOD[mm[1].trim()];
    if(!f) return null;
    const num = parseFloat(mm[2].replace(',', '.'));
    return { n: mm[1].trim(), g: mm[3] === 'шт' ? num * (f.unit || 1) : num, lo: 5, hi: 500, flex: true };
  }).filter(Boolean);
}
const qtyText = items => items.map(x => word(x.n) + ' ' + gOf(x)).join(', ');

function scaleParts(parts, targetK){
  const cur = sumOf(parts).k;
  if(cur > 0){
    const f = targetK / cur;
    for(const x of parts) x.g = roundG(FOOD[x.n], x.g * f);
  }
  fitKcal(parts, targetK);
  return parts;
}

/* что стоит в приёме сейчас: план, поставленная замена — или ничего,
   если приём решили пропустить */
function mealView(di, mi, k){
  k = k || who;
  const V = mealPlanned(di, mi, k);
  if(!skipped[swapKey(di, mi, k)]) return V;
  /* пропущенный приём остаётся на виду, но в счёт дня не идёт */
  return Object.assign({}, V, { skip:true, plan:V.v, v:{ k:0, p:0, f:0, c:0, b:0 } });
}
function mealPlanned(di, mi, k){
  k = k || who;
  const m = PLAN.days[di].meals[mi];
  const sw = swaps[swapKey(di, mi, k)];
  if(!sw || !sw.items || !sw.items.length){
    const f = mealFactor(k, PLAN.days[di].id), v = m[k];
    const scaled = Math.abs(f - 1) >= 0.005;
    /* заготовку в этом приёме могли поправить руками — тогда цифры
       генератора уже не те, и разницу нужно учесть */
    const d = recDirty() ? recShift(splitParts(v.qty), f) : null;
    const moved = !!(d && (d.k || d.p || d.f || d.c || d.b));
    if(!scaled && !moved)
      return { title:m.title, note:m.note, label:m.label, qty:v.qty, v, swapped:false };
    return { title:m.title, note:m.note, label:m.label, swapped:false, scaled, edited:moved,
             qty: scaled ? scaleQty(v.qty, f) : v.qty,
             v: { k:Math.round(v.k*f + (moved ? d.k : 0)), p:Math.round(v.p*f + (moved ? d.p : 0)),
                  f:Math.round(v.f*f + (moved ? d.f : 0)), c:Math.round(v.c*f + (moved ? d.c : 0)),
                  b:Math.round(((v.b || 0)*f + (moved ? d.b : 0))*10)/10 } };
  }
  const s = sumOf(sw.items);
  return {
    title: sw.title, note: sw.note || '', label: m.label, qty: qtyText(sw.items),
    v: { k:Math.round(s.k), p:Math.round(s.p), f:Math.round(s.f), c:Math.round(s.c), b:Math.round(s.b * 10) / 10 },
    swapped: true, tplId: sw.tplId, items: sw.items, parts: sw.parts
  };
}
function dayTotals(di, k){
  k = k || who;
  const dr = drinkTotals(k);
  return PLAN.days[di].meals.reduce((a, _, mi) => {
    const v = mealView(di, mi, k).v;
    a.k += v.k; a.p += v.p; a.f += v.f; a.c += v.c; a.b += (v.b || 0); return a;
  }, { k:Math.round(dr.k), p:Math.round(dr.p), f:Math.round(dr.f), c:Math.round(dr.c), b:0 });
}

/* ================= на двоих =================
   Готовим один раз, а норм две. У плиты нужны два разных числа: сколько
   продуктов взять всего — и сколько потом положить каждому. Складываем
   навески обоих и сразу показываем, как делить готовое. */

/* PLAN.recipes — то, что посчитал генератор, ORIG; RECIPE и RECIPES —
   то, что действует сейчас, с учётом правок из этого браузера. */
const ORIG = {};
PLAN.recipes.forEach(r => { ORIG[r.key] = r; });
let RECIPES = PLAN.recipes.slice();
let RECIPE = {};

/* Заготовки и «кухонные» продукты в кладовке конструктора не лежат,
   а в навесках и рецептах стоят наравне со всеми. Здесь они находятся. */
const BASE = PLAN.base || {};
function anyFood(n){
  const f = FOOD[n];
  if(f) return f;
  const r = RECIPE[n];
  if(r) return { n, k:r.per100.k, p:r.per100.p, f:r.per100.f, c:r.per100.c, b:r.per100.b || 0, batch:true };
  const b = BASE[n];
  return b ? { n, k:b.k, p:b.p, f:b.f, c:b.c } : null;
}
/* КБЖУ ингредиента заготовки: сырьё лежит либо в кладовке, либо в
   «кухонном» словаре. Заготовок внутри заготовок нет — это проверяет
   тест, — поэтому дальше рекурсия не нужна. */
function rawFood(n){
  const f = FOOD[n]; if(f) return f;
  const b = BASE[n]; if(b) return b;
  const r = ORIG[n]; return r ? r.per100 : null;
}
const ingTxt = (n, g) => {
  const f = FOOD[n];
  return f && f.unit ? Math.round(g / f.unit) + ' шт · ' + Math.round(g) + ' г' : Math.round(g) + ' г';
};
const yieldTxt = g => g >= 1000 ? String(Math.round(g / 100) / 10).replace('.', ',') + ' кг' : Math.round(g) + ' г';
/* заготовка с чужой навеской: КБЖУ на 100 г считается заново из состава
   и выхода — ровно так же, как это делает генератор */
function recalcRecipe(r, ov){
  const ing = (ov.ing || []).filter(x => x.g > 0)
    .map(x => ({ n:x.n, g:Math.round(x.g), txt:ingTxt(x.n, x.g) }));
  /* 0 и «2» в поле выхода — это середина набора числа, а не рецепт:
     пока не набрали осмысленное, считаем по исходному выходу */
  const outG = ov.outG >= 50 ? Math.round(ov.outG) : r.outG;
  const t = ing.reduce((a, x) => {
    const f = rawFood(x.n); if(!f) return a;
    a.k += f.k * x.g / 100; a.p += f.p * x.g / 100; a.f += f.f * x.g / 100;
    a.c += f.c * x.g / 100; a.b += (f.b || 0) * x.g / 100;
    return a;
  }, { k:0, p:0, f:0, c:0, b:0 });
  const one = x => Math.round(x / outG * 1000) / 10;
  const per100 = { k: Math.round(t.k / outG * 100), p: one(t.p), f: one(t.f), c: one(t.c), b: one(t.b) };
  const port = g => ({ k: Math.round(per100.k * g / 100), p: Math.round(per100.p * g / 100),
                       f: Math.round(per100.f * g / 100), c: Math.round(per100.c * g / 100) });
  return Object.assign({}, r, { ing, outG, per100, vw: port(r.pw), vm: port(r.pm), edited: true,
    gear: String(r.gear).replace(/выход\s+[^·]+/, 'выход ' + yieldTxt(outG) + ' ') });
}
function rebuildRecipes(){
  RECIPES = PLAN.recipes.map(r => recEdit[r.key] ? recalcRecipe(r, recEdit[r.key]) : r);
  RECIPE = {};
  RECIPES.forEach(r => { RECIPE[r.key] = r; });
}
rebuildRecipes();
const recDirty = () => Object.keys(recEdit).length > 0;
/* Заготовку поправили — приёмы, где она стоит, должны поехать следом.
   Плановое КБЖУ приёма посчитал генератор, поэтому пересчитываем не весь
   приём, а разницу: сколько эта заготовка давала и сколько даёт теперь. */
function recShift(parts, f){
  const d = { k:0, p:0, f:0, c:0, b:0 };
  for(const x of parts){
    const now = RECIPE[x.n], was = ORIG[x.n];
    if(!now || !was || !now.edited) continue;
    const g = x.g * f / 100;
    d.k += (now.per100.k - was.per100.k) * g;
    d.p += (now.per100.p - was.per100.p) * g;
    d.f += (now.per100.f - was.per100.f) * g;
    d.c += (now.per100.c - was.per100.c) * g;
    d.b += ((now.per100.b || 0) - (was.per100.b || 0)) * g;
  }
  return d;
}
/* сколько приёмов недели держится на этой заготовке */
function mealsWithBatch(key){
  let n = 0;
  for(let di = 0; di < PLAN.days.length; di++)
    for(let mi = 0; mi < PLAN.days[di].meals.length; mi++)
      for(const k of ['m', 'w'])
        if(splitParts(PLAN.days[di].meals[mi][k].qty).some(x => x.n === key)){ n++; break; }
  return n;
}
/* сколько класть по умолчанию: штука — штукой, весовое — примерно на
   80 ккал, чтобы добавленный продукт сразу был похож на порцию */
function defG(n){
  const f = anyFood(n); if(!f) return 0;
  if(f.unit) return f.unit;
  if(!(f.k > 0)) return 50;
  return Math.min(200, Math.max(10, Math.round(8000 / f.k / 5) * 5));
}
function splitParts(text){
  const out = [];
  String(text).split(', ').forEach(t => {
    const mm = t.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(г|шт|мл)$/);
    if(!mm) return;
    const n = mm[1].trim(), f = anyFood(n), num = parseFloat(mm[2].replace(',', '.'));
    out.push({ n, g: mm[3] === 'шт' ? num * ((f && f.unit) || 1) : num });
  });
  return out;
}
function partsOfMeal(di, mi, k){
  const V = mealView(di, mi, k);
  /* пропущенный приём не готовят: складывать и взвешивать нечего */
  if(V.skip) return { V, parts: [] };
  return { V, parts: (V.items && V.items.length)
    ? V.items.map(x => ({ n:x.n, g:x.g, r:x.r, side:x.side })) : splitParts(V.qty) };
}
/* Калории на тарелку не положишь. Считаем ещё и вес: сколько граммов
   готового блюда наливать каждому и сколько идёт вприкуску. */
function plateOf(parts){
  return parts.reduce((a, x) => { a[x.side ? 'side' : 'dish'] += x.g; return a; }, { dish:0, side:0 });
}
const gTxt = (n, g) => {
  const f = anyFood(n);
  return f && f.unit ? Math.round(g / f.unit) + ' шт' : nf(g) + ' г';
};
/* один приём на двоих: общий вес по каждому продукту и деление по тарелкам */
function pairMeal(di, mi){
  const A = partsOfMeal(di, mi, 'm'), B = partsOfMeal(di, mi, 'w');
  const skM = !!A.V.skip, skW = !!B.V.skip;
  /* если один пропускает — складывать нечего, готовится одна порция */
  const together = !skM && !skW && A.V.title === B.V.title && (A.V.tplId || '') === (B.V.tplId || '');
  const map = new Map();
  const add = (parts, key) => parts.forEach(x => {
    const e = map.get(x.n) || { n:x.n, m:0, w:0 };
    e[key] += x.g; map.set(x.n, e);
  });
  add(A.parts, 'm'); add(B.parts, 'w');
  const rows = Array.from(map.values()).map(e => Object.assign(e, { g: e.m + e.w }));
  const kk = A.V.v.k + B.V.v.k;
  return { di, mi, A, B, rows, together, skM, skW, k:kk, share: kk > 0 ? Math.round(A.V.v.k / kk * 100) : 50,
           pm: plateOf(A.parts), pw: plateOf(B.parts) };
}
/* порядок готовки, пересчитанный на общий вес: одна сковорода на двоих */
function pairSteps(P, m){
  const k = m || MUL();
  if(!P.together || !P.A.V.tplId || !P.A.V.items || !P.B.V.items) return null;
  const used = [];
  const merged = P.A.V.items.map(x => {
    const i = P.B.V.items.findIndex((y, j) => y.n === x.n && y.r === x.r && used.indexOf(j) < 0);
    if(i >= 0) used.push(i);
    return Object.assign({}, x, { g: (x.g + (i >= 0 ? P.B.V.items[i].g : 0)) * k });
  });
  const st = stepsFor(dishById(P.A.V.tplId), merged);
  return st && !st.broken ? st : null;
}
/* весь день одним списком: что достать из заготовок, что взвесить свежим */
function pairDay(di){
  const map = new Map();
  PLAN.days[di].meals.forEach((_, mi) => pairMeal(di, mi).rows.forEach(r => {
    const e = map.get(r.n) || { n:r.n, m:0, w:0, g:0 };
    e.m += r.m; e.w += r.w; e.g += r.g; map.set(r.n, e);
  }));
  const all = Array.from(map.values()).sort((a, b) => b.g - a.g);
  return { batch: all.filter(x => RECIPE[x.n]), fresh: all.filter(x => !RECIPE[x.n]) };
}
/* молоко в чашках — тоже общий расход, его удобно знать заранее */
function pairDrinks(){
  const a = drinkTotals('m'), b = drinkTotals('w');
  if(!a.cups && !b.cups) return null;
  const ml = k => (k.cups || 0) * (k.ml || 0), sg = k => (k.cups || 0) * (k.sug || 0);
  return { cups:(a.cups || 0) + (b.cups || 0), ml:ml(a) + ml(b), sug:sg(a) + sg(b),
           k:a.k + b.k, milk:a.milk || b.milk, a, b };
}

/* варианты замены под КБЖУ именно этого приёма */
function swapOptions(di, mi){
  const m = PLAN.days[di].meals[mi];
  const aim = { k: m[who].k, p: m[who].p };
  const label = (m.label === 'Вечер' || m.label === 'Перекус') ? 'Перекус' : m.label;

  const dishes = [], seen = new Set();
  for(let t = 0; t < 120 && dishes.length < 3; t++){
    const r = assembleDish(label, null, aim);
    if(!r || seen.has(r.tpl.id)) continue;
    const v = sumOf(r.items);
    if(Math.abs(v.k - aim.k) > aim.k * 0.15) continue;
    seen.add(r.tpl.id);
    dishes.push({ tpl:r.tpl, items:r.items, v });
  }

  const small = aim.k <= 320;                 // размер перекуса, а не полноценного приёма
  const bank = label === 'Перекус' ? PLAN.snacks.concat(PLAN.sweets) : PLAN.snacks;
  const light = [];
  for(const x of small ? bank : []){
    const parts = parseQty(x.qty);
    if(!parts.length) continue;
    if(x.k > aim.k * 1.4 || x.k < aim.k * 0.7) continue;   // дальше растягивать — уже нелепо
    const was = parts.map(y => y.g);
    const items = scaleParts(parts, aim.k);
    if(Math.abs(sumOf(items).k - aim.k) > aim.k * 0.15) continue;
    if(items.some((y, i) => y.g > was[i] * 1.6 || y.g < was[i] * 0.55)) continue;
    light.push({ title:x.title, items, note:x.note });
    if(light.length >= 4) break;
  }

  /* два перекуса вместо одного: половина калорий на каждый */
  let split = null;
  const half = aim.k / 2;
  const fit = small ? PLAN.snacks.filter(x => parseQty(x.qty).length && x.k <= half * 1.8 && x.k >= half * 0.5) : [];
  if(fit.length >= 2){
    const a = fit[Math.floor(Math.random() * fit.length)];
    const rest = fit.filter(x => x.title !== a.title);
    const b = rest[Math.floor(Math.random() * rest.length)];
    const pa = parseQty(a.qty), pb = parseQty(b.qty);
    const wa = pa.map(y => y.g), wb = pb.map(y => y.g);
    split = [{ title:a.title, items:scaleParts(pa, half) },
             { title:b.title, items:scaleParts(pb, half) }];
    const tot = sumOf(split[0].items.concat(split[1].items)).k;
    const wild = split[0].items.some((y, i) => y.g > wa[i] * 1.8 || y.g < wa[i] * 0.4) ||
                 split[1].items.some((y, i) => y.g > wb[i] * 1.8 || y.g < wb[i] * 0.4);
    if(Math.abs(tot - aim.k) > aim.k * 0.2 || wild) split = null;
  }
  return { aim, dishes, light, split };
}

/* чем заменить конкретный продукт: та же роль, равные калории,
   а для белковых — равный белок, иначе замена ломает норму */
function subsFor(name, grams){
  const f = FOOD[name];
  if(!f) return [];
  if(f.k * grams / 100 < 25) return [];          // мелочь вроде 6 г какао заменять незачем
  const byProtein = f.cat === 'Белок' && f.p >= 8;
  const src = byProtein ? f.p * grams / 100 : f.k * grams / 100;
  /* внутри белка держим подгруппу: творог меняется на йогурт, а не на фарш —
     по граммам белка это одно и то же, а по смыслу в десерте нет мяса*/
  const grp = n => /творог|йогурт|протеин|кефир|молоко|сыр|сметана/.test(n) ? 'молочное'
    : /фарш|филе|бедро/.test(n) ? 'мясо'
    : /минтай|треска|тунец|хек/.test(n) ? 'рыба'
    : /яйцо/.test(n) ? 'яйцо' : 'прочее';
  const g0 = grp(name);
  const near = x => (grp(x.n) === g0 ? 0 : 100) +
    Math.abs(x.p - f.p) + Math.abs(x.f - f.f) + Math.abs(x.c - f.c);
  return allFoods()
    .filter(x => x.n !== name && x.cat === f.cat && pantry[x.n] && (byProtein ? x.p >= 4 : x.k > 0))
    .sort((a, b) => near(a) - near(b))            // сначала близкие по составу
    .map(x => {
      const g = roundG(x, byProtein ? src / (x.p / 100) : src / (x.k / 100));
      return { n:x.n, g, k:Math.round(x.k * g / 100), p:Math.round(x.p * g / 100) };
    })
    .filter(x => x.g >= 5 && x.g <= 400)
    .slice(0, 4);
}

function applySwap(di, mi, data){
  swaps[swapKey(di, mi)] = data;
  store.set('kotel.swaps', swaps);
  openSwap = null;
}
/* Свой продукт удалён — вычищаем его из уже поставленных замен, иначе
   в приёме остаётся строка без КБЖУ, а пересчёт порции второму падает. */
function purgeFood(n){
  let touched = false;
  for(const key of Object.keys(swaps)){
    const sw = swaps[key];
    if(!sw || !sw.items) continue;
    const left = sw.items.filter(x => x.n !== n);
    if(left.length === sw.items.length) continue;
    touched = true;
    if(left.length) sw.items = left; else delete swaps[key];
  }
  if(touched) store.set('kotel.swaps', swaps);
  /* тот же продукт мог стоять в правленой заготовке */
  let inRec = false;
  for(const key of Object.keys(recEdit)){
    const ov = recEdit[key], was = (ov.ing || []).length;
    const left = (ov.ing || []).filter(x => x.n !== n);
    if(left.length === was) continue;
    inRec = true;
    if(left.length) ov.ing = left; else delete recEdit[key];
  }
  if(inRec){ store.set('kotel.recipes', recEdit); rebuildRecipes(); }
}

/* пропустить приём и вернуть его обратно — одно и то же движение */
function toggleSkip(di, mi, k){
  const key = swapKey(di, mi, k);
  if(skipped[key]) delete skipped[key]; else skipped[key] = 1;
  store.set('kotel.skip', skipped);
}
function dropSwap(di, mi){
  delete swaps[swapKey(di, mi)];
  store.set('kotel.swaps', swaps);
}

/* Набор блюд на день подбирается один раз и для двоих сразу: незачем
   перещёлкивать те же замены во втором меню. Переносим состав как есть,
   а навеску пересчитываем под норму второго — порции у них разные,
   и копировать их один в один нельзя. */
function daySwaps(di, k){
  return PLAN.days[di].meals.reduce((n, _, mi) => {
    const sw = swaps[swapKey(di, mi, k)];
    return n + (sw && sw.items && sw.items.length ? 1 : 0);
  }, 0);
}
function dayApart(di){
  return PLAN.days[di].meals.reduce((n, _, mi) => n + (pairMeal(di, mi).together ? 0 : 1), 0);
}
function syncDay(di, from){
  const src = from || who, dst = src === 'm' ? 'w' : 'm';
  const dayId = PLAN.days[di].id, f = mealFactor(dst, dayId);
  let moved = 0, cleared = 0, skips = 0;
  PLAN.days[di].meals.forEach((m, mi) => {
    const sw = swaps[swapKey(di, mi, src)], key = swapKey(di, mi, dst);
    /* пропуск — тоже часть набора дня: перенести блюда и оставить у
       второго дыру было бы странно */
    if(skipped[swapKey(di, mi, src)]){ if(!skipped[key]){ skipped[key] = 1; skips++; } }
    else if(skipped[key]){ delete skipped[key]; skips++; }
    if(!sw || !sw.items || !sw.items.length){
      if(swaps[key]){ delete swaps[key]; cleared++; }
      return;
    }
    const aimK = Math.max(60, m[dst].k * f);
    swaps[key] = { title: sw.title, note: sw.note || '', tplId: sw.tplId || null,
                   items: twinOf(sw.items, aimK) };
    moved++;
  });
  store.set('kotel.swaps', swaps);
  store.set('kotel.skip', skipped);
  return { moved, cleared, dst, skips };
}

function fromMeal(di, mi){
  const m = PLAN.days[di].meals[mi];
  const parts = m[who].qty.split(', ').map(t => {
    const mm = t.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(г|шт)$/);
    if(!mm) return null;
    const name = mm[1].trim(), num = parseFloat(mm[2].replace(',', '.'));
    const f = FOOD[name];
    if(!f) return null;
    return { n: name, g: mm[3] === 'шт' ? num * (f.unit || 1) : num };
  }).filter(Boolean);
  return { parts, title: m.title, unknown: m[who].qty.split(', ').length - parts.length };
}

/* Некоторые блюда физически не дают нужного белка: четыре яйца в шакшуке
   это 28 г при цели 37, а нут — 9 г при цели 21. Подгонка тут бессильна,
   зато можно сказать об этом и предложить, чем добрать. */
/* Протеин в шакшуку и куриное филе в творожный крем — тот же случайный
   ингредиент ради цифры. Добираем тем, что в блюдо действительно кладут. */
const PROT_FIX = {
  savory: ['яйцо', 'сыр лёгкий', 'филе куриное', 'творожный сыр', 'тунец с/с'],
  sweet:  ['творог 5%', 'протеин', 'йогурт греческий']
};
function proteinGap(){
  if(!built.length) return null;
  const aim = aimFor(aimMeal), tot = sumOf(built);
  const gap = aim.p - tot.p;
  if(gap < aim.p * 0.15) return null;
  const pick2 = PROT_FIX[kindOf(builtTpl)].filter(n => FOOD[n] && pantry[n] && !built.some(x => x.n === n));
  return { gap: Math.round(gap), aim, have: Math.round(tot.p), fix: pick2[0] || null };
}
function addProtein(){
  const g = proteinGap();
  if(!g || !g.fix) return;
  const f = FOOD[g.fix];
  const need = roundG(f, Math.min(g.gap / (f.p / 100), 200));
  built.push({ n:g.fix, g:need, r:'prot2', lo:f.unit || 5, hi:Math.max(need * 2, 120), flex:true, side:true });
  fitAim(built, g.aim.k, g.aim.p);
  consNote = '';
  render();
}

  const menuDishes = dishesFor(aimMeal);

  const list = allFoods();
  const cats = [...new Set(list.map(f => f.cat))];
  const onCount = list.filter(f => pantry[f.n]).length;
  const catOpts = cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const form = showForm ? `

    <div class="cons">
      <div>
        <div class="res-list">${comps}</div>
        ${built.length ? `<div class="aim" style="margin-top:12px">
          <div class="aim-row"><span>Калории</span><b>${Math.round(tot.k)} / ${aim.k}</b></div>

          <div class="aim-row"><span>Белок</span><b>${Math.round(tot.p)} / ${aim.p} г</b></div>

          <div class="aim-row"><span>Клетчатка</span><b>${Math.round(tot.b * 10) / 10} г</b></div>

/* Свой продукт: валидируем то, что реально ломает расчёт, а спорное
   показываем предупреждением и всё равно сохраняем — на упаковках
   сумма макросов часто не сходится с калорийностью. */
function saveDrinks(){
  const val = id => (document.getElementById(id) || {}).value || '';
  const num = id => { const v = parseFloat(String(val(id)).replace(',', '.')); return isNaN(v) ? 0 : v; };
  const pr = Object.assign({}, profiles[who] || {});
  const cups = Math.round(num('dr_cups'));
  if(cups <= 0){ delete pr.drinks; }
  else pr.drinks = { cups, ml: Math.round(num('dr_ml')), sugar: Math.round(num('dr_sugar')), milk: val('dr_milk') || 'молоко 2,5%' };
  profiles[who] = pr;
  store.set('kotel.profiles', profiles);
  render();
}

function saveProfile(){
  const val = id => (document.getElementById(id) || {}).value || '';
  const num = id => { const v = parseFloat(String(val(id)).replace(',', '.')); return isNaN(v) ? 0 : v; };
  const p = Object.assign({}, profiles[who] || {});
  /* Опечатка в одном поле превращает план в голодание молча: 8 вместо 18%
     дефицита никак себя не проявит, а 80 — даст 500 ккал в день. Поэтому
     режем по границам и говорим, что именно урезали. */
  const lim = [];
  const cut = (v, lo, hi, name, unit) => {
    const c = Math.min(hi, Math.max(lo, v));
    if(Math.abs(c - v) > 0.001) lim.push(name + ' — ' + String(c).replace('.', ',') + unit);
    return c;
  };
  p.sex = val('pf_sex') || (who === 'm' ? 'm' : 'w');
  const age = Math.round(num('pf_age')), h = Math.round(num('pf_h')), wt = Math.round(num('pf_wt') * 10) / 10;
  p.age = age > 0 ? cut(age, 14, 90, 'возраст', ' лет') : age;
  p.h   = h  > 0 ? cut(h, 120, 220, 'рост', ' см') : h;
  p.wt  = wt > 0 ? cut(wt, 35, 250, 'вес', ' кг') : wt;
  p.act = num('pf_act') || ACT_DEF;
  p.gymH = cut(num('pf_gh') || 1, 0.5, 3, 'тренировка', ' ч');
  const wn = Math.round(num('pf_wn')), wk = num('pf_wk');
  p.walk = { n: cut(wn > 0 ? wn : 0, 0, 21, 'прогулок', ' в неделю'),
             km: cut(wk > 0 ? wk : 0, 0, 30, 'километров', ' за раз'),
             pace: num('pf_wp') || PACE_DEF };
  const def = num('pf_def'), gk = num('pf_gk');
  p.def = cut(def > 0 ? def : 12, 5, 30, 'дефицит', '%');
  p.gk  = cut(gk > 0 ? gk : 1.8, 1.2, 2.5, 'белок', ' г/кг');
  p.fk  = p.fk || 0.9;
  profileNote = lim.length
    ? 'Поправлено до безопасных границ: ' + lim.join(', ') + '. Глубже дефицит и выше белок на дефиците смысла не имеют, а вреда приносят достаточно.'
    : '';
  if(!calcNorm(p)){ profiles[who] = p; store.set('kotel.profiles', profiles); render(); return; }
  /* журнал: пишем, только если вес поменялся или записи ещё нет */
  const hist = (p.hist || []).slice();
  const today = new Date().toISOString().slice(0, 10);
  const last = hist[hist.length - 1];
  if(!last || Math.abs(last.wt - p.wt) >= 0.1){ hist.push({ d: today, wt: p.wt }); }
  else if(last) { last.d = today; }
  p.hist = hist.slice(-10);
  profiles[who] = p;
  store.set('kotel.profiles', profiles);
  render();
}

function saveFood(){
  const val = id => (document.getElementById(id) || {}).value || '';
  const num = id => { const v = parseFloat(String(val(id)).replace(',', '.')); return isNaN(v) ? 0 : v; };
  const n = val('fn').trim().replace(/["'<>]/g, '');
  const k = num('fk'), p = num('fp'), f = num('ff'), c = num('fu'), b = num('fb'), unit = Math.round(num('fs'));

  if(n.length < 2){ formMsg = '!Название нужно хотя бы из двух букв.'; render(); return; }
  if(FOOD[n]){ formMsg = '!Продукт «' + n + '» уже есть в списке. Назовите иначе или отредактируйте существующий.'; render(); return; }
  if(k <= 0 || k > 900){ formMsg = '!Калорийность должна быть от 1 до 900 ккал на 100 г.'; render(); return; }
  if(p < 0 || f < 0 || c < 0 || b < 0){ formMsg = '!Макросы не бывают отрицательными.'; render(); return; }
  if(b > 80){ formMsg = '!Клетчатки больше 80 г на 100 г не бывает даже у отрубей.'; render(); return; }
  if(p + f + c > 100){ formMsg = '!Белки, жиры и углеводы вместе не могут весить больше 100 г из 100 г.'; render(); return; }
  if(unit < 0 || unit > 1000){ formMsg = '!Вес штуки — от 1 до 1000 г, либо оставьте поле пустым.'; render(); return; }

  const calc = p * 4 + f * 9 + c * 4;
  const off = Math.abs(calc - k);
  custom.push({ n, cat: val('fc') || 'Белок', k, p, f, c, b, unit: unit > 0 ? unit : 0, on: true, mine: true });
  pantry[n] = true;
  store.set('kotel.custom', custom); store.set('kotel.pantry', pantry);
  rebuildFood();
  showForm = false;
  formMsg = off > Math.max(25, k * 0.25)
    ? '?Сохранил, но сверьтесь: по макросам выходит ' + Math.round(calc) + ' ккал, а вы указали ' + Math.round(k) + '. Считать буду по вашей цифре.'
    : '';
  render();
}

/* Навески в меню масштабируются по калориям — значит белок и жир едут
   следом, а не следуют за своей нормой. При сильном отклонении веса от
   базового это расходится, и лучше показать разницу, чем прятать. */
function planGives(k){
  const a = { k:0, p:0, f:0, c:0 };
  for(let d = 0; d < PLAN.days.length; d++){
    const t = dayTotals(d, k);
    a.k += t.k; a.p += t.p; a.f += t.f; a.c += t.c;
  }
  const n = PLAN.days.length;
  return { k:a.k / n, p:a.p / n, f:a.f / n, c:a.c / n };
}

/* Кончилась курица — руками менять шесть приёмов недели незачем.
   Находим все, где продукт стоит, и пересобираем их из того, что осталось
   дома, под те же калории и белок. */
/* Курица чаще стоит не строкой в приёме, а внутри заготовки: плов, лазанья,
   тефтели. Считаем и такие приёмы — иначе «кончилась курица» находит один
   ужин из десяти. */
const usesFood = (name, n) => name === n || (RECIPE[name] && RECIPE[name].ing.some(x => x.n === n));
function mealsUsing(n, k){
  const out = [];
  for(let di = 0; di < PLAN.days.length; di++){
    for(let mi = 0; mi < PLAN.days[di].meals.length; mi++){
      const V = mealView(di, mi, k);
      const parts = V.items && V.items.length ? V.items : splitParts(V.qty);
      if(parts.some(x => usesFood(x.n, n)))
        out.push({ di, mi, label: V.label, k: V.v.k, p: V.v.p });
    }
  }
  return out;
}
/* Сладкое не трогаем: это фиксированный слот, а не блюдо из кладовки. */
function rebuildWithout(n, k){
  const who0 = who;
  who = k || who;
  const hits = mealsUsing(n, who);
  let done = 0, kept = 0;
  for(const h of hits){
    if(h.label === 'Вечер'){ kept++; continue; }
    const label = h.label === 'Перекус' ? 'Перекус' : h.label;
    let best = null;
    for(let t = 0; t < 60; t++){
      const r = assembleDish(label, null, { k: h.k, p: h.p });
      if(!r || r.items.some(x => usesFood(x.n, n))) continue;
      const v = sumOf(r.items);
      /* замена должна попасть и в калории, и в белок: иначе на месте
         куриного ужина в 54 г белка оказываются вафли с двадцатью */
      const dk = Math.abs(v.k - h.k) / h.k;
      const dp = h.p > 0 ? (v.p - h.p) / h.p : 0;
      const miss = dk + Math.abs(dp) * 0.8;
      if(!best || miss < best.miss) best = { r, miss, dk, dp, v };
      if(dk < 0.05 && Math.abs(dp) < 0.12) break;
    }
    if(!best || best.dk > 0.15 || best.dp < -0.3){ kept++; continue; }
    const st = stepsFor(best.r.tpl, best.r.items);
    applySwap(h.di, h.mi, {
      title: st && !st.broken ? cap(st.title) : best.r.tpl.short,
      tplId: best.r.tpl.id, items: best.r.items
    });
    done++;
  }
  who = who0;
  return { done, kept, total: hits.length };
}

  const fmt = d => { const x = new Date(d); return String(x.getDate()).padStart(2,'0') + '.' + String(x.getMonth()+1).padStart(2,'0') + '.' + x.getFullYear(); };

  let trend = '';
  if(hist.length >= 2){
    const a = hist[0], b = hist[hist.length - 1];
    const days = Math.max(1, Math.round((new Date(a.d) - new Date(b.d)) / 86400000));
    const per = (a.wt - b.wt) / days * 7;
    const dw = a.wt - b.wt;
    const num = v => Math.abs(v).toFixed(v === Math.round(v) ? 0 : 1).replace('.', ',');

        : per > 0.15 ? 'Дефицита фактически нет: проверьте, всё ли попадает в счёт.'
        : (per < 0 && fast) ? 'Быстрее, чем стоило бы: на таком темпе уходит не только жир. Добавьте 100–150 ккал обратно.'
        : per < 0 ? 'Темп в рабочем коридоре, так и держите.'

  const rows = [

    <h5 class="sub-h" style="margin-top:2px">Дни зала</h5>
    <p class="lead" style="margin-bottom:10px">В плане тренировки стоят по понедельникам, средам и пятницам — отметьте свои. В дни зала калорий больше на ${GYM_SPREAD[who]}, в остальные меньше; недельное среднее от перестановки не меняется, а навески в меню пересчитываются сами.</p>
    <div class="pillbar" style="padding:0 0 12px">${PLAN.days.map((x, i) => `<button type="button" data-gym="${i}" aria-pressed="${isGym(i)}">${x.name.slice(0, 3)}<i>${nf(targetFor(who, x.id))}</i></button>`).join('')}</div>
    ${gymCount() === 0 || gymCount() === PLAN.days.length
      ? `<p class="verdict v-warn" style="margin:0 0 12px">${gymCount() ? 'Зал каждый день — тогда и калории каждый день одинаковые.' : 'Тренировок нет ни в одном дне: все дни идут по среднему.'} Недельная норма от этого не меняется, меняется только раскладка по дням.</p>` : ''}

    </div>
    ${n ? `<div class="norm-out" style="margin-top:14px">
      <div><span class="lbl">Обмен покоя</span><b>${nf(n.bmr)}</b> <s>ккал</s></div>
      <div><span class="lbl">Быт</span><b>${nf(n.life)}</b> <s>ккал</s></div>

      <div><span class="lbl">Прогулки</span><b>+${nf(n.walk)}</b> <s>ккал/день</s></div>

  </div>
  ${(() => {

      : share >= 50
        ? 'Половина дней мимо плана. Прежде чем менять норму, стоит вернуть дисциплину: чаще всего дефицит съедают именно эти дни.'
        : 'Большая часть дней прошла не по плану. Считать эффективность нормы пока не по чему — сначала неделя-другая как задумано.';
    return `<div class="card sec">
      <div class="sec-h"><h2>Дневник питания</h2><span class="lbl">за ${st.back} дней</span></div>
      <div class="norm-out">
        <div><span class="lbl">Отмечено дней</span><b>${st.marked}</b> <s>из ${st.back}</s></div>
        <div><span class="lbl">По плану</span><b>${st.plan}</b> <s>${share}%</s></div>
        <div><span class="lbl">Ели другое</span><b>${st.off}</b> <s>дней</s></div>
        ${st.dev !== null ? `<div><span class="lbl">Средняя разница</span><b>${st.dev > 0 ? '+' : '−'}${nf(Math.abs(st.dev))}</b> <s>ккал</s></div>` : ''}
      </div>
      <p class="verdict ${share >= 80 ? 'v-ok' : 'v-warn'}" style="margin-top:12px">${verdict}</p>
    </div>`;
  })()}
  ${hist.length ? `<div class="card sec">
    <div class="sec-h"><h2>Журнал веса</h2><span class="lbl">${hist.length} ${hist.length === 1 ? 'запись' : hist.length < 5 ? 'записи' : 'записей'}</span></div>
    ${trend ? `<p class="verdict v-ok" style="margin-bottom:12px">${esc(trend)}</p>` : ''}
    <div class="hist">${hist.map((x, i) => {
      const prev = hist[i + 1];
      const d = prev ? x.wt - prev.wt : 0;
      return `<div class="hist-row"><span class="d">${fmt(x.d)}</span>
        <span class="dt">${String(x.wt).replace('.', ',')} кг</span>
        <b class="${d < 0 ? 'dn' : d > 0 ? 'up' : ''}">${prev ? (d > 0 ? '+' : d < 0 ? '−' : '') + (d ? Math.abs(d).toFixed(1).replace('.', ',') : '0') + ' кг' : 'старт'}</b></div>`;
    }).join('')}</div>
    <p class="lead" style="font-size:12.5px;margin-top:12px">Взвешивайтесь раз в неделю утром натощак и записывайте сюда. Норма пересчитывается сразу, а формула — только гипотеза с разбросом ±15%: последнее слово всегда за динамикой на весах.</p>
  </div>` : ''}`;
}

function pageSearch(){
  const R = searchAll(query);
  if(!R) return `<div class="card sec"><p class="empty"><b>Введите хотя бы две буквы</b>Поиск идёт по блюдам недели, навескам, рецептам, перекусам и списку покупок.</p></div>`;
  if(!R.total) return `<div class="card sec"><p class="empty"><b>Ничего не нашлось</b>По запросу «${esc(query)}» совпадений нет. Попробуйте часть слова — например «гриб» вместо «шампиньоны».</p></div>`;
  const head = (t,n) => `<div class="res-h"><h3>${t}</h3><span class="c">${n}</span></div>`;
  let out = `<div class="card sec"><div class="sec-h"><h2>Найдено: ${R.total}</h2><span class="lbl">запрос «${esc(query)}» · порции: ${person(who).name.toLowerCase()}</span></div>`;
  if(R.meals.length){
    out += head('В меню недели', R.meals.length) + '<div class="res-list">' + R.meals.map(({d,di,m}) => {
      const v = m[who];
      return `<button type="button" class="res-row" data-day="${di}">${donut(v.p,v.f,v.c,34,6)}
        <span><h5>${hl(m.title,R.q)}</h5><span class="s">${esc(d.name)} · ${TAGN[m.label]||m.label} · ${hl(v.qty,R.q)}</span></span>
        <span class="kk">${nf(v.k)}</span></button>`;
    }).join('') + '</div>';
  }
  if(R.recipes.length){
    out += head('Рецепты', R.recipes.length) + '<div class="res-list">' + R.recipes.map(({r,ri}) => {
      const ing = r.ing.filter(i => i.n.toLowerCase().includes(R.q)).map(i => i.n);
      return `<button type="button" class="res-row" data-recipe="${ri}">${donut(r.per100.p,r.per100.f,r.per100.c,34,6)}
        <span><h5>${hl(r.title,R.q)}</h5><span class="s">${esc(r.gear)}${ing.length?' · в навеске: '+ing.map(x=>hl(x,R.q)).join(', '):''}</span></span>
        <span class="kk">${r.per100.k}/100 г</span></button>`;
    }).join('') + '</div>';
  }
  for(const [t,list,dest] of [['Перекусы',R.snacks,'snacks'],['Сладкое',R.sweets,'snacks']]){
    if(!list.length) continue;
    out += head(t, list.length) + '<div class="res-list">' + list.map(x =>
      `<button type="button" class="res-row" data-go="${dest}">${donut(x.p,x.f,x.c,34,6)}
        <span><h5>${hl(x.title,R.q)}</h5><span class="s">${hl(x.qty,R.q)}</span></span>
        <span class="kk">${x.k}</span></button>`).join('') + '</div>';
  }
  if(R.shop.length){
    out += head('В списке покупок', R.shop.length) + '<div class="res-list">' + R.shop.map(x =>
      `<button type="button" class="res-row" data-go="shop"><span class="lbl" style="text-align:center">${esc(x.g.slice(0,2))}</span>
        <span><h5>${hl(x.n,R.q)}</h5><span class="s">${esc(x.t)} · ${esc(x.g)}</span></span>
        <span class="kk">${esc(x.amt)}</span></button>`).join('') + '</div>';
  }
  return out + '</div>';
}

/* Чего не хватает, чтобы блюдо вообще собралось: пустые обязательные роли
   и продукты, которыми они закрываются. */
function dishNeeds(t){
  const need = [];
  for(const sl of t.slots){
    if(!sl.req || slotPool(sl).length) continue;
    const want = (sl.only || []).filter(n => FOOD[n]);
    need.push(want.length ? want[0] : (sl.cat || 'продукт'));
  }
  return need;
}
/* Все продукты, которые блюдо вообще может попросить — по ним и ищем. */
function dishFoods(t){
  const out = [];
  for(const sl of t.slots) for(const n of (sl.only || [])) out.push(n);
  return out;
}
function dishHit(t, qq){
  if(!qq) return true;
  const hay = (t.short + ' ' + t.title + ' ' + t.gear + ' ' +
    dishFoods(t).map(n => n + ' ' + word(n)).join(' ')).toLowerCase();
  return hay.indexOf(qq) >= 0;
}

function editOpen(di, mi){
  const V = mealView(di, mi);
  const parts = (V.items && V.items.length) ? V.items : splitParts(V.qty);
  editKey = di + '.' + mi;
  edQ = '';
  editDraft = parts.map(x => ({ n:x.n, g:x.g, r:x.r, side:!!x.side, off:false }));
}
function editSave(di, mi){
  const V = mealView(di, mi);
  const items = (editDraft || []).filter(x => !x.off && x.g > 0)
    .map(x => ({ n:x.n, g:x.g, r:x.r, side:x.side }));
  if(!items.length){ dropSwap(di, mi); }
  else applySwap(di, mi, { title: V.title, note: V.note || '', tplId: V.tplId || null, items });
  editKey = null; editDraft = null;
}
/* шаг ввода: штучные продукты правятся штуками, остальные граммами */
const stepOf = n => { const f = anyFood(n); return (f && f.unit) || 1; };
const inUnits = (n, g) => Math.round(g / stepOf(n) * 10) / 10;

function editPanel(di, mi){
  const V = mealView(di, mi);
  const tot = sumOf((editDraft || []).filter(x => !x.off && x.g > 0));
  const aim = V.v.k;
  const rows = (editDraft || []).map((x, i) => {
    const f = anyFood(x.n), unit = f && f.unit;
    const v = sumOf([{ n:x.n, g:x.g }]);
    return `<div class="comp${x.off ? ' off' : ''}">
      <span><h5>${esc(word(x.n))}</h5><span class="s">${x.off ? 'не учитывается' : Math.round(v.k) + ' ккал · Б ' + v.p.toFixed(1) + ' · Ж ' + v.f.toFixed(1) + ' · У ' + v.c.toFixed(1)}</span></span>
      <span class="g"><input id="ed_${i}" type="text" inputmode="decimal"
        value="${x.off ? '' : shown('ed_' + i, inUnits(x.n, x.g))}"${x.off ? ' disabled' : ''}><s>${unit ? 'шт' : 'г'}</s></span>
      <button type="button" class="del" data-edoff="${i}" aria-pressed="${x.off}" aria-label="${x.off ? 'Вернуть' : 'Не учитывать'} ${esc(word(x.n))}">${svg(x.off ? 'plus' : 'x')}</button>
    </div>`;
  }).join('');
  const d = Math.round(tot.k - aim);
  /* Добавить в приём. План — не приговор: съели ещё йогурт, положили
     хлеба к супу, добавили ложку масла. Продукт попадает в тот же
     черновик, что и правка веса, и сохраняется той же заменой. */
  const qq = edQ.trim().toLowerCase();
  const has = n => (editDraft || []).some(x => x.n === n);
  const pool = allFoods().concat(RECIPES.map(r => ({ n:r.key })))
    .filter(f => !has(f.n) && (qq ? (f.n + ' ' + word(f.n)).toLowerCase().indexOf(qq) >= 0 : !!pantry[f.n]))
    .sort((a, b) => (pantry[b.n] ? 1 : 0) - (pantry[a.n] ? 1 : 0))

  return `<div class="swp">

    <span class="lbl" style="margin-top:12px">Добавить в приём<i></i></span>

      ? `<div class="dish-pick" style="padding:0">${pool.map(f =>
          `<button type="button" data-edadd="${esc(f.n)}">${esc(word(f.n))} <b>${esc(gTxt(f.n, defG(f.n)))}</b></button>`).join('')}</div>`
      : `<p class="s" style="font-size:11.5px;color:var(--ink3)">Ничего не нашлось${qq ? ' по запросу «' + esc(edQ) + '»' : ''}. Без запроса показаны только продукты, отмеченные дома.</p>`}
    <div class="aim" style="margin-top:10px">
      <div class="aim-row"><span>Было по плану</span><b>${nf(aim)} ккал</b></div>
      <div class="aim-row"><span>Стало</span><b>${nf(tot.k)} ккал · Б ${Math.round(tot.p)} · Ж ${Math.round(tot.f)} · У ${Math.round(tot.c)}</b></div>
      <div class="aim-row"><span>Разница</span><b>${Math.abs(d) < 5 ? 'столько же' : (d > 0 ? '+' : '−') + nf(Math.abs(d)) + ' ккал'}</b></div>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
      <button type="button" class="btn" data-edsave="${di}.${mi}">Сохранить</button>
      <button type="button" class="btn btn-2" data-edclose="1">Отмена</button>
      ${V.swapped ? '<button type="button" class="btn btn-2" data-undo="' + di + '.' + mi + '">Вернуть как в плане</button>' : ''}
    </div>
  </div>`;
}

function swapPanel(di, mi){
  const O = swapOptions(di, mi);
  const cur = mealView(di, mi);
  let out = '<div class="swp">';
  if(O.dishes.length){
    out += '<div class="swp-g"><span class="lbl">Другое блюдо<i></i></span>' + O.dishes.map(d => {
      const st = stepsFor(d.tpl, d.items);
      return optRow(st && !st.broken ? cap(st.title) : d.tpl.short,
        d.tpl.gear + ' · ' + d.tpl.time, Math.round(d.v.k),
        { di, mi, title: st && !st.broken ? cap(st.title) : d.tpl.short, tplId: d.tpl.id,
          items: d.items.map(x => ({ n:x.n, g:x.g, r:x.r, side:!!x.side })) });
    }).join('') + '</div>';
  }
  if(O.light.length){
    out += '<div class="swp-g"><span class="lbl">Готовое без готовки<i></i></span>' + O.light.map(x =>
      optRow(x.title, qtyText(x.items), Math.round(sumOf(x.items).k),
        { di, mi, title: x.title, items: x.items.map(y => ({ n:y.n, g:y.g })) })).join('') + '</div>';
  }
  if(O.split){
    const items = O.split[0].items.concat(O.split[1].items).map(y => ({ n:y.n, g:y.g }));
    out += '<div class="swp-g"><span class="lbl">Разбить на два поменьше<i></i></span>' +
      optRow(O.split[0].title + ' + ' + O.split[1].title,
             qtyText(O.split[0].items) + ' · ' + qtyText(O.split[1].items),
             Math.round(sumOf(items).k),
             { di, mi, title: O.split[0].title + ' + ' + O.split[1].title, items }) + '</div>';
  }
  /* Поиск по кладовке: что ещё соберётся прямо сейчас и что почти
     собирается — с точным списком, чего для этого не хватает. */
  {
    const m0 = PLAN.days[di].meals[mi];
    const lab = (m0.label === 'Вечер' || m0.label === 'Перекус') ? 'Перекус' : m0.label;
    const qq = swapQ.trim().toLowerCase();
    const pool = DISHES.filter(t => t.meals.indexOf(lab) >= 0 && dishHit(t, qq));
    const ready = pool.filter(t => dishFits(t) && minKcal(t) <= O.aim.k * 1.05);
    const near = pool.filter(t => !dishFits(t))
      .map(t => ({ t, need: dishNeeds(t) }))
      .filter(x => x.need.length && x.need.length <= 2)
      .sort((a, b) => a.need.length - b.need.length)
      .slice(0, 6);
    out += `<div class="swp-g"><span class="lbl">Собрать из того, что есть<i></i></span>
      <input id="swq" class="swq" type="search" placeholder="Блюдо или продукт: паста, тунец, духовка" value="${esc(swapQ)}">
      ${ready.length
        ? `<div class="dish-pick" style="padding:0">${ready.map(t => `<button type="button" data-swapdish="${di}.${mi}.${t.id}">${esc(t.short)}</button>`).join('')}</div>`
        : `<p class="s" style="font-size:11.5px;color:var(--ink3)">Из отмеченного дома под этот приём ничего не собирается${qq ? ' по запросу «' + esc(swapQ) + '»' : ''}. Отметьте больше продуктов в конструкторе.</p>`}
      ${near.length
        ? `<span class="lbl" style="margin-top:10px">Почти хватает<i></i></span>${near.map(x => `<div class="near"><b>${esc(x.t.short)}</b><span>купить: ${x.need.map(n => esc(word(n))).join(', ')}</span></div>`).join('')}`
        : ''}
    </div>`;
  }

  const parts = cur.items ? cur.items : parseQty(cur.qty);
  const subLines = parts.map(x => {
    const alts = subsFor(x.n, x.g);
    if(!alts.length) return '';
    return `<div class="subs"><span class="src">Нет под рукой <b>${esc(word(x.n))} ${gOf(x)}</b> — можно взять:</span>` +
      alts.map(al => {
        const next = parts.map(y => y.n === x.n ? { n:al.n, g:al.g, r:y.r, side:!!y.side } : { n:y.n, g:y.g, r:y.r, side:!!y.side });
        return `<button type="button" class="sub-b" data-apply="${esc(JSON.stringify(
          { di, mi, title: cur.title, tplId: cur.tplId || null, items: next }))}">${esc(word(al.n))} <b>${al.g} г</b></button>`;
      }).join('') + '</div>';
  }).filter(Boolean).join('');
  const whole = (cur.qty || '').split(', ').length - parts.length;
  if(subLines || whole > 0){
    out += '<div class="swp-g"><span class="lbl">Нет продукта — чем заменить<i></i></span>' + subLines +
      (whole > 0 ? '<p class="s" style="font-size:11.5px;color:var(--ink3)">Часть приёма — готовое блюдо из заготовок, по продуктам оно не раскладывается. Его состав и замены смотрите в разделе «Рецепты».</p>' : '') + '</div>';
  }
  out += `<div style="display:flex;gap:7px;flex-wrap:wrap">
    <button type="button" class="btn btn-2" data-swapclose="1">Закрыть</button>
    ${cur.swapped ? '<button type="button" class="btn btn-2" data-undo="' + di + '.' + mi + '">Вернуть как в плане</button>' : ''}
    <span class="lbl" style="align-self:center">цель приёма: ${nf(O.aim.k)} ккал · белок ${O.aim.p} г</span>
  </div></div>`;
  return out;
}
function drinkRow(){

/* «лазанья 455 г, капуста 115 г, помидор 95 г, масло 4 г» читается как
   один состав, и первый вопрос — где фарш. А это две разные вещи:
   заготовка, внутри которой фарш и есть, и салат рядом с ней. Разводим
   их по строкам и даём раскрыть состав заготовки. */
function qtySplit(V){
  const parts = (V.items && V.items.length) ? V.items.map(x => ({ n:x.n, g:x.g })) : splitParts(V.qty);
  const pieces = String(V.qty).split(', ').length;
  /* хлеб печётся впрок, но в приёме он всегда рядом, а не «из заготовки»:
     иначе яичница с тостом выглядит как блюдо из хлеба с яйцом сбоку */
  const main = x => RECIPE[x.n] && x.n !== 'хлеб';
  const batch = parts.filter(main);
  const rest = parts.filter(x => !main(x));
  /* если разбор потерял часть строки — показываем как есть, без выдумок */
  return { batch, rest, all: parts.filter(x => RECIPE[x.n]),
           ok: batch.length > 0 && parts.length === pieces };
}
const qtyLine = list => list.map(x => esc(word(x.n)) + ' ' + gOf(x)).join(', ');

function mealRow(m, di, mi){
  /* у пропущенного приёма в счёт дня идёт ноль, а показываем то, что
     он давал бы: иначе непонятно, чего именно день недосчитался */
  const V = mealView(di, mi), v = V.skip ? V.plan : V.v;
  const cls = TAG[V.label] || 'tg-ghost', nm = TAGN[V.label] || V.label;
  const key = di + '.' + mi, open = openSwap === key;
  const st = V.swapped && V.tplId ? stepsFor(dishById(V.tplId), V.items) : null;
  return `<div class="meal${V.swapped ? ' sw' : ''}${V.skip ? ' skipped' : ''}">
    ${donut(v.p,v.f,v.c,44,7)}
    <div>
      <div class="meal-h"><h4>${esc(V.title)}</h4><span class="tag ${cls}">${nm}</span>${V.swapped ? '<span class="swapped-tag">замена</span>' : ''}${V.skip ? '<span class="skip-tag">пропущен</span>' : ''}</div>
      ${(() => {
        const sp = qtySplit(V);
        if(!sp.ok) return `<p class="qty">${esc(V.qty)}</p>`;
        return `<p class="qty"><em class="src">Из заготовки:</em> ${qtyLine(sp.batch)}${sp.rest.length ? '<br><em class="src">Рядом:</em> ' + qtyLine(sp.rest) : ''}</p>`;
      })()}
      ${V.note ? `<p class="note">${esc(V.note)}</p>` : ''}
      ${qtySplit(V).all.map(x => batchDetails({ n:x.n, g:x.g }, 1)).join('')}
      ${st && !st.broken ? `<ol class="mini-steps" style="margin-top:6px">${st.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol>` : ''}
    </div>
    <div class="meal-r">
      <span class="macro-mini">
        <span class="mm mm-p">Б ${v.p}</span><span class="mm mm-f">Ж ${v.f}</span><span class="mm mm-c">У ${v.c}</span>
      </span>
      <span class="kcal-b"><b>${nf(v.k)}</b><span>${V.skip ? 'не в счёт' : 'ккал'}</span></span>
    </div>
    <div class="meal-a">
      ${V.skip ? '' : `<button type="button" class="swap-btn" data-swap="${key}" aria-expanded="${open}">${svg('swap')}Заменить</button>
      <button type="button" class="swap-btn" data-edit="${key}" aria-expanded="${editKey === key}">${svg('plus')}Состав</button>`}
      <button type="button" class="swap-btn" data-skip="${key}" aria-pressed="${!!V.skip}">${svg(V.skip ? 'plus' : 'x')}${V.skip ? 'Вернуть приём' : 'Пропустить'}</button>
    </div>
    ${!V.skip && open ? swapPanel(di, mi) : ''}
    ${!V.skip && editKey === key ? editPanel(di, mi) : ''}
  </div>`;
}

    <p class="lead" style="margin:12px 0 0">Готовите сразу на двоих? Тогда эти навески нужно сложить с её — и знать, сколько потом положить каждому.</p>
    <div class="row" style="margin-top:9px;gap:7px;flex-wrap:wrap">
      <button type="button" class="btn btn-2" data-goto="pair">${svg('two')}Показать день на двоих</button>

    ${syncNote ? `<p class="verdict v-ok" style="margin-top:10px">${esc(syncNote)}</p>` : ''}

const pairHead = m => '<div class="sh"><span>Продукт</span><b>' + ((m || MUL()) > 1 ? 'На два дня' : 'Всего') + '</b><i>Он</i><i>Она</i></div>';
const pairRow = (r, m) => `<div><span>${esc(word(r.n))}</span>` +
  `<b>${gTxt(r.n, r.g * (m || MUL()))}</b><i>${r.m ? gTxt(r.n, r.m) : '—'}</i><i>${r.w ? gTxt(r.n, r.w) : '—'}</i></div>`;

function batchDetails(r, m){
  const rc = RECIPE[r.n]; if(!rc) return '';
  const k = m || MUL(), g = r.g * k, f = g / (rc.outG || 1000);
  const part = f > 1.05
    ? String(Math.round(f * 10) / 10).replace('.', ',') + ' закладки — придётся готовить с запасом'
    : Math.round(f * 100) + '% закладки';
  return `<details class="sub"><summary>${esc(word(r.n))}: ${nf(g)} г — это ${part}</summary>
    <ul class="ing">${rc.ing.map(x => `<li>${esc(x.n)}<span>${Math.round(x.g * f)} г из ${esc(x.txt)}</span></li>`).join('')}</ul>
    <p class="n" style="margin-top:7px">Готовится вся закладка сразу и живёт два дня. Граммы выше — только та доля, что уйдёт ${k > 1 ? 'за эти два дня' : 'в этот приём'}; варить отдельно столько смысла нет.</p>
  </details>`;
}

function pairCard(P){
  const V = P.A.V, cls = TAG[V.label] || 'tg-ghost', nm = TAGN[V.label] || V.label;
  if(P.skM && P.skW){
    return `<div class="item">

    </div>`;
  }
  if(!P.together){
    const one = P.skM || P.skW;
    const line = (nm2, V2) => V2.skip
      ? `<p class="q"><b>${nm2}</b> · пропускает этот приём</p>`
      : `<p class="q"><b>${nm2}</b> · ${esc(V2.title)}, ${nf(V2.v.k)} ккал<br>${esc(V2.qty)}</p>`;
    return `<div class="item">
      <div class="meal-h"><h4>${one ? 'Готовим на одного' : 'Разные блюда'}</h4><span class="tag ${cls}">${nm}</span><span class="swapped-tag">${one ? 'без сложения' : 'готовится отдельно'}</span></div>
      ${line('Он', P.A.V)}
      ${line('Она', P.B.V)}
      <p class="n">${one
        ? 'Один пропускает приём, поэтому навески не складываются: готовится ровно одна порция — та, что выше.'
        : 'Кто-то поставил замену на этот приём, складывать нечего. Вернуть общее блюдо можно в «Неделе» кнопкой «Вернуть как в плане».'}</p>
    </div>`;
  }
  const k = MUL(), st = pairSteps(P);
  const batch = P.rows.filter(r => RECIPE[r.n]);
  const plate = P.pm.dish + P.pw.dish, aside = P.pm.side + P.pw.side;
  return `<div class="item">
    <div class="meal-h"><h4>${esc(V.title)}</h4><span class="tag ${cls}">${nm}</span>${k > 1 ? '<span class="tag tg-ghost">готовим ×2</span>' : ''}<span class="lbl">делится ${P.share} / ${100 - P.share}</span></div>
    <div class="split">${pairHead()}${P.rows.map(r => pairRow(r)).join('')}
      <div class="tot"><span>${k > 1 ? 'Сварить всего' : 'На тарелку'}</span><b>${nf(plate * k)} г</b><i>${nf(P.pm.dish)} г</i><i>${nf(P.pw.dish)} г</i></div>
      ${k > 1 ? `<div><span>Остаётся на завтра</span><b>${nf(plate * (k - 1))} г</b><i>${nf(P.pm.dish)} г</i><i>${nf(P.pw.dish)} г</i></div>` : ''}
      ${aside ? `<div><span>Вприкуску</span><b>${nf(aside * k)} г</b><i>${nf(P.pm.side)} г</i><i>${nf(P.pw.side)} г</i></div>` : ''}
      <div><span>Калории</span><b>${nf(P.k * k)} ккал</b><i>${nf(P.A.V.v.k)}</i><i>${nf(P.B.V.v.k)}</i></div>
    </div>
    ${st ? `<ol class="mini-steps" style="margin-top:9px">${st.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol>` : ''}
    ${!st && V.note ? `<p class="n">${esc(V.note)}</p>` : ''}
    ${batch.map(batchDetails).join('')}
  </div>`;
}

function pagePair(){
  const d = PLAN.days[day];
  const tabs = PLAN.days.map((x, i) =>

  const cards = d.meals.map((_, mi) => pairCard(pairMeal(day, mi)));
  const tm = dayTotals(day, 'm'), tw = dayTotals(day, 'w');
  const both = tm.k + tw.k, sh = both > 0 ? Math.round(tm.k / both * 100) : 50;
  const D = pairDay(day), dr = pairDrinks();
  const apart = d.meals.filter((_, mi) => !pairMeal(day, mi).together).length;
  const k = MUL(), nd = PLAN.days[(day + 1) % PLAN.days.length];
  const nm2 = targetFor('m', nd.id), nw2 = targetFor('w', nd.id);
  const dm = tm.k - nm2, dw = tw.k - nw2, worst = Math.abs(dm) > Math.abs(dw) ? dm : dw;
  const x2note = Math.abs(dm) <= 60 && Math.abs(dw) <= 60
    ? 'почти совпадает с нормой, поправлять нечего'
    : worst > 0
      ? 'на ' + nf(Math.abs(dm)) + ' и ' + nf(Math.abs(dw)) + ' ккал больше — завтра стоит убрать сладкое или укоротить перекус'
      : 'на ' + nf(Math.abs(dm)) + ' и ' + nf(Math.abs(dw)) + ' ккал меньше — завтра добавьте перекус';

  return `
  <div class="card pillbar">${tabs}</div>

    <p class="lead" style="margin-bottom:14px">Готовим один раз, а норм две. Здесь навески обоих сложены: левый столбец — сколько продуктов взять и положить в кастрюлю, два соседних — сколько потом раскладывать по тарелкам. Складываются только приёмы, где у вас одно и то же блюдо${apart ? '; в этом дне ' + mealsWord(apart) + (apart === 1 ? ' идёт' : ' идут') + ' отдельно' : ''}.</p>
    <div class="norm-out">
      <div><span class="lbl">Всего за день</span><b>${nf(both)}</b> <s>ккал</s></div>
      <div><span class="lbl">Ему</span><b>${nf(tm.k)}</b> <s>ккал</s></div>
      <div><span class="lbl">Ей</span><b>${nf(tw.k)}</b> <s>ккал</s></div>
      <div><span class="lbl">Пропорция</span><b>${sh} / ${100 - sh}</b> <s>ему / ей</s></div>
      <div><span class="lbl">Белок на двоих</span><b>${Math.round(tm.p + tw.p)}</b> <s>г</s></div>
    </div>
    <div class="row" style="margin-top:12px;gap:7px;flex-wrap:wrap">
      <button type="button" class="btn btn-2" id="doX2" aria-pressed="${cookX2}">${svg('pot')}Готовлю сразу на два дня</button>
      ${apart ? `<button type="button" class="btn" data-sync="${day}">${svg('swap')}Сделать день одинаковым</button>` : ''}
    </div>
    ${k > 1 ? `<p class="verdict v-warn" style="margin-top:10px">Готовим двойной объём: столбец слева — сколько варить, соседние два — сколько раскладывать сегодня. Второй комплект уйдёт на ${esc(nd.name.toLowerCase())}, а там по плану ${nf(nm2)} и ${nf(nw2)} ккал — повтор сегодняшнего ${x2note}.</p>` : ''}
    ${apart ? `
    <p class="lead" style="margin:9px 0 0">${cap(mealsWord(apart))} собран${apart === 1 ? '' : 'ы'} по-разному — сложить такое нельзя. Кнопка перенесёт состав того, кто выбран в шапке (сейчас ${person(who).name}), второму и пересчитает навеску под ${POSS[who === "m" ? "w" : "m"]} норму.</p>` : ''}
    ${syncNote ? `<p class="verdict v-ok" style="margin-top:10px">${esc(syncNote)}</p>` : ''}
    <p class="verdict v-ok" style="margin-top:12px">Разница между порциями — примерно ${Math.round((tm.k / Math.max(1, tw.k) - 1) * 100)}%. Это не «ему больше, потому что мужчина», а разные нормы: у него больше масса и глубже дефицит. Проще всего готовить общий вес и делить на глаз в этой пропорции, а белковую часть — по весам.</p>
  </div>
  <div class="card sec">
    <div class="sec-h"><h2>Приёмы пищи</h2><span class="lbl">общий вес и как делить</span></div>
    <p class="lead" style="margin-bottom:14px">Вес в таблице — это вес навески. У заготовок он и есть вес готового блюда, а у сырого мяса на пару и в духовке уйдёт ещё 10–15% воды; пропорция деления от этого не меняется.</p>
    <div class="grid" style="gap:9px">${cards.join('')}</div>
  </div>
  <div class="card sec">
    <div class="sec-h"><h2>Что достать и взвесить${k > 1 ? ' на два дня' : ' за день'}</h2><span class="lbl">всё сложено на двоих</span></div>
    <p class="lead" style="margin-bottom:14px">Тот же расчёт, но одним списком: с этим удобно один раз подойти к холодильнику, а не бегать к нему четыре раза.</p>
    ${D.batch.length ? `<h5 class="sub-h">Достать из заготовок</h5>
      <div class="split">${pairHead()}${D.batch.map(r => pairRow(r)).join('')}</div>
      ${D.batch.map(batchDetails).join('')}` : ''}
    ${D.fresh.length ? `<h5 class="sub-h">Взвесить сегодня</h5>
      <div class="split">${pairHead()}${D.fresh.map(r => pairRow(r)).join('')}</div>` : ''}
    ${dr ? `<h5 class="sub-h">Напитки${k > 1 ? ' — на один день' : ''}</h5>
      <div class="split">
        ${pairHead(1)}
        <div><span>${esc(word(dr.milk || 'молоко 2,5%'))} в чашки</span><b>${Math.round(dr.ml)} мл</b><i>${Math.round((dr.a.cups || 0) * (dr.a.ml || 0)) || '—'}</i><i>${Math.round((dr.b.cups || 0) * (dr.b.ml || 0)) || '—'}</i></div>
        ${dr.sug ? `<div><span>сахар в чашки</span><b>${Math.round(dr.sug)} г</b><i>${Math.round((dr.a.cups || 0) * (dr.a.sug || 0)) || '—'}</i><i>${Math.round((dr.b.cups || 0) * (dr.b.sug || 0)) || '—'}</i></div>` : ''}
        <div class="tot"><span>Чашек за день</span><b>${dr.cups}</b><i>${dr.a.cups || '—'}</i><i>${dr.b.cups || '—'}</i></div>
      </div>` : ''}
  </div>`;
}

/* Правка заготовки: навеска, выход и то, что из этого следует для меню. */
function recPanel(r){
  const d = recDraft || { ing: r.ing.map(x => ({ n:x.n, g:x.g })), outG: r.outG };
  const rows = d.ing.map((x, i) => {
    const f = anyFood(x.n), unit = f && f.unit, v = sumOf([{ n:x.n, g:x.g }]);
    return `<div class="comp">
      <span><h5>${esc(word(x.n))}</h5><span class="s">${Math.round(v.k)} ккал · Б ${v.p.toFixed(1)} · Ж ${v.f.toFixed(1)} · У ${v.c.toFixed(1)}</span></span>
      <span class="g"><input id="rg_${i}" type="text" inputmode="decimal" value="${shown('rg_' + i, inUnits(x.n, x.g))}"><s>${unit ? 'шт' : 'г'}</s></span>
      <button type="button" class="del" data-rgoff="${i}" aria-label="Убрать ${esc(word(x.n))}">${svg('x')}</button>
    </div>`;
  }).join('');
  const qq = recQ.trim().toLowerCase();
  const has = n => d.ing.some(x => x.n === n);
  const pool = allFoods().concat(Object.keys(BASE).map(n => ({ n })))
    .filter(f => !has(f.n) && (qq ? (f.n + ' ' + word(f.n)).toLowerCase().indexOf(qq) >= 0 : !!pantry[f.n]))
    .slice(0, 12);
  const was = ORIG[r.key], now = recalcRecipe(was, d);
  const mass = d.ing.reduce((a, x) => a + x.g, 0);
  const used = mealsWithBatch(r.key), dk = now.per100.k - was.per100.k;
  const num = x => String(x).replace('.', ',');
  return `<div class="swp">
    <span class="lbl">Навеска закладки<i></i></span>
    <p class="s" style="font-size:11.5px;color:var(--ink3);margin-bottom:9px">Меняются граммы или выход — КБЖУ на 100 г считается заново, и следом едут все приёмы недели, где эта заготовка стоит. Правка живёт только в этом браузере.</p>
    <div class="res-list">${rows}</div>
    <span class="lbl" style="margin-top:12px">Добавить в закладку<i></i></span>
    <input id="rq" class="swq" type="search" placeholder="Продукт: грибы, сметана, мука" value="${esc(recQ)}">
    ${pool.length
      ? `<div class="dish-pick" style="padding:0">${pool.map(f =>
          `<button type="button" data-recadd="${esc(f.n)}">${esc(word(f.n))}</button>`).join('')}</div>`
      : `<p class="s" style="font-size:11.5px;color:var(--ink3)">Ничего не нашлось${qq ? ' по запросу «' + esc(recQ) + '»' : ''}. Без запроса показаны продукты, отмеченные дома.</p>`}
    <div class="aim" style="margin-top:10px">
      <div class="aim-row"><span>Навеска сырого</span><b>${nf(mass)} г</b></div>
      <div class="aim-row"><span>Выход готового</span><b><input id="rout" type="text" inputmode="decimal" value="${shown('rout', Math.round(d.outG))}"> г</b></div>
      <div class="aim-row"><span>Было на 100 г</span><b>${was.per100.k} ккал · Б ${num(was.per100.p)} · Ж ${num(was.per100.f)} · У ${num(was.per100.c)}</b></div>
      <div class="aim-row"><span>Станет на 100 г</span><b>${now.per100.k} ккал · Б ${num(now.per100.p)} · Ж ${num(now.per100.f)} · У ${num(now.per100.c)}</b></div>
      <div class="aim-row"><span>В меню</span><b>${used ? mealsWord(used) + (dk ? ', сдвиг ' + (dk > 0 ? '+' : '−') + Math.abs(dk) + ' ккал на 100 г' : ', калорийность та же') : 'эта заготовка в меню не стоит'}</b></div>
    </div>
    ${d.outG < 50 ? '<p class="verdict v-warn" style="margin-top:10px">Выход меньше 50 г — столько не выходит даже из одной вафли. Пока в поле не наберётся осмысленное число, считаю по исходному выходу.</p>' : ''}
    ${now.per100.k > 700 ? '<p class="verdict v-warn" style="margin-top:10px">На 100 г выходит больше, чем у чистого масла, — почти наверняка занижен выход. У супа он больше навески за счёт воды, у запеканки меньше на выпаренную влагу, но не в разы.</p>' : ''}
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
      <button type="button" class="btn" data-recsave="${esc(r.key)}">Сохранить</button>
      <button type="button" class="btn btn-2" data-recclose="1">Отмена</button>
      ${r.edited ? `<button type="button" class="btn btn-2" data-recreset="${esc(r.key)}">Вернуть исходный</button>` : ''}
    </div>
  </div>`;
}
/* вернулись к исходной навеске — правку не храним, чтобы «изменено» не
   висело на заготовке, которая ничем от плановой не отличается */
const sameAsPlan = (r0, ing, outG) => outG === r0.outG && ing.length === r0.ing.length &&
  ing.every((x, i) => x.n === r0.ing[i].n && Math.round(x.g) === r0.ing[i].g);
function saveRecipe(){
  const ing = recDraft.ing.filter(x => x.g > 0).map(x => ({ n:x.n, g:Math.round(x.g) }));
  const r0 = ORIG[recKey];
  const outG = recDraft.outG >= 50 ? Math.round(recDraft.outG) : r0.outG;
  if(!ing.length || sameAsPlan(r0, ing, outG)) delete recEdit[recKey];
  else recEdit[recKey] = { ing, outG };
  store.set('kotel.recipes', recEdit);
  rebuildRecipes();
  recKey = null; recDraft = null; recQ = '';
}

function pageSnacks(){
  return `
