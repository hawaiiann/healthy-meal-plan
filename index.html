<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Недельный план питания на двоих: КБЖУ считается из навесок, конструктор собирает блюдо из того, что есть дома.">
<meta name="theme-color" content="#EEF4E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12150D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Один котёл, два половника">
<meta property="og:description" content="Недельный план питания на двоих с конструктором блюд.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍲%3C/text%3E%3C/svg%3E">
<title>Один котёл, два половника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
</head>
<body><style>
:root{
  --bg:#EEF4E1; --card:#FFFFFF; --soft:#F5F5F0; --mint:#F1F7E4; --sunk:#EDEFE7;
  --line:#E5E6DE; --line-c:#E1EAD0; --line2:#CDD0C4;
  --ink:#1F2A16; --ink2:#5C6650; --ink3:#6A725F;
  --lime:#A9DB63; --lime-d:#86BB3C; --on-lime:#22300F; --lime-soft:#DCF0AF;
  --kcal:#4A721D; --kcal-bg:#E3F0C8;
  --prot:#F0913F; --prot-on:#3D2007; --prot-bg:#FBE0C8; --prot-ink:#995114;
  --fat:#8C8F7E;  --fat-bg:#EDEEE9;  --fat-ink:#63695B;
  --carb:#C9A227; --carb-bg:#FCEBBB; --carb-ink:#8A6410;
  --br:#7E5A0E; --br-bg:#FCE3A0;
  --lu:#4A6B1A;  --lu-bg:#DCF0AF;
  --di:#8A461B;  --di-bg:#FBC79A;
  --sn:#2F6B62;  --sn-bg:#D9EDE9;
  --sw:#585185;  --sw-bg:#E7E5F3;
  --dot:#F4A340; --promo:#F7CE5C; --promo-ink:#3A2B06; --field:#F2F5EC;
  --r:16px; --r2:12px; --r3:9px;
  --shadow:0 1px 2px rgba(31,42,22,.05), 0 8px 24px -16px rgba(31,42,22,.2);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12150D; --card:#1B2014; --soft:#22261C; --mint:#1E2417; --sunk:#171B11;
    --line:#333A2C; --line-c:#2E3724; --line2:#454D3C;
    --ink:#EBF0DF; --ink2:#B0BAA2; --ink3:#8D977F;
    --lime:#A9DB63; --lime-d:#C2E88A; --on-lime:#18240C; --lime-soft:#26351A;
    --kcal:#A8D46B; --kcal-bg:#26351A;
    --prot:#E2853A; --prot-on:#1E1206; --prot-bg:#3A2617; --prot-ink:#EC9F5D;
    --fat:#9BA38D;  --fat-bg:#2A2E25;  --fat-ink:#A6AE98;
    --carb:#D9B54A; --carb-bg:#352C16; --carb-ink:#DEBE64;
    --br:#DEBE64; --br-bg:#352C16;
    --lu:#A8D46B;  --lu-bg:#26351A;
    --di:#EC9F5D;  --di-bg:#3A2617;
    --sn:#79B5AC;  --sn-bg:#16302C;
    --sw:#ABA5DC;  --sw-bg:#232138;
    --dot:#E9973B; --promo:#D9AE45; --promo-ink:#241A03; --field:#232A1A;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -16px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#12150D; --card:#1B2014; --soft:#22261C; --mint:#1E2417; --sunk:#171B11;
  --line:#333A2C; --line-c:#2E3724; --line2:#454D3C;
  --ink:#EBF0DF; --ink2:#B0BAA2; --ink3:#8D977F;
  --lime:#A9DB63; --lime-d:#C2E88A; --on-lime:#18240C; --lime-soft:#26351A;
  --kcal:#A8D46B; --kcal-bg:#26351A;
  --prot:#E2853A; --prot-on:#1E1206; --prot-bg:#3A2617; --prot-ink:#EC9F5D;
  --fat:#9BA38D;  --fat-bg:#2A2E25;  --fat-ink:#A6AE98;
  --carb:#D9B54A; --carb-bg:#352C16; --carb-ink:#DEBE64;
  --br:#DEBE64; --br-bg:#352C16;
  --lu:#A8D46B;  --lu-bg:#26351A;
  --di:#EC9F5D;  --di-bg:#3A2617;
  --sn:#79B5AC;  --sn-bg:#16302C;
  --sw:#ABA5DC;  --sw-bg:#232138;
  --dot:#E9973B; --promo:#D9AE45; --promo-ink:#241A03; --field:#232A1A;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -16px rgba(0,0,0,.65);
}

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:"Golos Text",system-ui,sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-family:Nunito,system-ui,sans-serif; margin:0; letter-spacing:-.015em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; border:none; background:none; cursor:pointer}
:focus-visible{outline:2px solid var(--lime-d); outline-offset:2px; border-radius:6px}
.num{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.lbl{font-family:Nunito,sans-serif; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3)}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:230px minmax(0,1fr) 306px; gap:14px; padding:14px; max-width:1420px; margin:0 auto; align-items:start}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}

/* ---------- sidebar ---------- */
.side{position:sticky; top:14px; padding:18px 14px; display:flex; flex-direction:column; gap:6px}
.brand{display:flex; align-items:center; gap:10px; padding:2px 6px 16px}
.brand-mark{width:32px; height:32px; border-radius:10px; background:var(--lime); display:grid; place-items:center; flex:0 0 auto}
.brand-mark svg{width:19px; height:19px; display:block}
.brand b{font-family:Nunito,sans-serif; font-size:16.5px; font-weight:800; line-height:1.15; display:block}
.brand span{font-size:11px; color:var(--ink3); display:block; margin-top:1px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px; font-family:Nunito,sans-serif; font-size:14px; font-weight:600; color:var(--ink2); text-align:left; width:100%}
.nav button svg{width:17px; height:17px; flex:0 0 auto; opacity:.75}
.nav button:hover{background:var(--mint); color:var(--ink)}
.nav button[aria-current="true"]{background:var(--lime); color:var(--on-lime)}
.nav button[aria-current="true"] svg{opacity:1}
.nav .count{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink3)}
.nav button[aria-current="true"] .count{color:var(--on-lime); opacity:.65}

.who-switch{margin-top:16px; padding:12px; background:var(--mint); border:1px solid var(--line); border-radius:var(--r2)}
.who-switch .lbl{display:block; margin-bottom:8px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--sunk); padding:3px; border-radius:10px}
.seg button{padding:7px 4px; border-radius:8px; font-family:Nunito,sans-serif; font-weight:700; font-size:13px; color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.segm{display:none; flex:0 0 auto; grid-template-columns:auto auto}
.segm button{padding:6px 12px; font-size:12px}
.who-meta{margin-top:9px; font-size:11.5px; color:var(--ink3); line-height:1.35}
.who-meta b{color:var(--ink2); font-weight:600}

/* ---------- main ---------- */
.main{display:flex; flex-direction:column; gap:14px; min-width:0}
.topbar{display:flex; align-items:center; gap:12px; padding:14px 18px; flex-wrap:wrap}
.topbar h1{font-size:21px; font-weight:800; flex:1 1 auto; min-width:140px}
.topbar .sub{font-size:12.5px; color:var(--ink3); width:100%; margin-top:-4px}
.pillbar{display:flex; gap:6px; overflow-x:auto; padding:12px; scrollbar-width:thin}
.pillbar button{flex:0 0 auto; padding:7px 13px; border-radius:99px; font-family:Nunito,sans-serif; font-weight:700; font-size:13px; color:var(--ink2); border:1px solid var(--line)}
.pillbar button:hover{background:var(--mint)}
.pillbar button[aria-pressed="true"]{background:var(--lime); color:var(--on-lime); border-color:var(--lime)}
.pillbar button i{font-style:normal; font-family:"JetBrains Mono",monospace; font-size:10.5px; opacity:.6; margin-left:5px}

.search{position:relative; flex:1 1 200px; max-width:330px; min-width:150px}
.search input{width:100%; padding:9px 30px 9px 33px; border-radius:99px; border:1px solid var(--line-c);
  background:var(--field); color:var(--ink); font:inherit; font-size:13.5px; -webkit-appearance:none}
.search input::placeholder{color:var(--ink3)}
.search input::-webkit-search-cancel-button{display:none}
.search .mg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink3); pointer-events:none}
.search .clr{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:22px; height:22px; border-radius:50%; display:grid; place-items:center; color:var(--ink3)}
.search .clr:hover{background:var(--sunk); color:var(--ink)}
.search .clr svg{width:12px; height:12px}

.theme-seg{display:flex; gap:2px; background:var(--sunk); padding:3px; border-radius:9px; flex:0 0 auto}
.theme-seg button{width:30px; height:26px; border-radius:7px; display:grid; place-items:center; color:var(--ink3)}
.theme-seg button svg{width:14px; height:14px}
.theme-seg button:hover{color:var(--ink)}
.theme-seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.1)}

.promo{margin-top:14px; padding:14px; border-radius:var(--r2); background:var(--promo); color:var(--promo-ink)}
.promo .lbl{color:var(--promo-ink); opacity:.65; display:block; margin-bottom:7px}
.promo p{font-size:12.5px; line-height:1.4; margin-bottom:11px}
.promo p b{font-weight:700}
.promo button{background:var(--lime); color:var(--on-lime); padding:7px 13px; border-radius:99px;
  font-family:Nunito,sans-serif; font-weight:700; font-size:12px}
.promo button:hover{background:var(--lime-d)}

/* ---------- свой продукт ---------- */
.ffm{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; padding:12px;
  background:var(--mint); border:1px solid var(--line-c); border-radius:var(--r2); margin-bottom:10px}
.ffm .wide{grid-column:1 / -1}
.ffm label{display:block; font-family:Nunito,sans-serif; font-size:9.5px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); margin-bottom:4px}
.ffm input,.ffm select{width:100%; padding:7px 9px; border-radius:8px; border:1px solid var(--line-c);
  background:var(--card); color:var(--ink); font:inherit; font-size:13px}
.ffm .row{grid-column:1 / -1; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.ffm .msg{grid-column:1 / -1; font-size:11.5px; line-height:1.4; padding:8px 10px; border-radius:var(--r3)}
.ffm .msg.err{background:var(--prot-bg); color:var(--prot-ink)}
.ffm .msg.warn{background:var(--carb-bg); color:var(--carb-ink)}
.ffm .msg.hint{background:var(--card); color:var(--ink3); border:1px solid var(--line-c)}
.pline{display:flex; align-items:center; gap:2px}
.pline label{flex:1 1 auto; min-width:0}
.pline .rm{width:20px; height:20px; border-radius:6px; color:var(--ink3); display:grid; place-items:center; flex:0 0 auto}
.pline .rm:hover{background:var(--prot-bg); color:var(--prot-ink)}
.pline .rm svg{width:11px; height:11px}
.mine{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--lime-d); flex:0 0 auto}

/* ---------- параметры ---------- */
.prm{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px}
.prm .wide{grid-column:1 / -1}
.prm label{display:block; font-family:Nunito,sans-serif; font-size:9.5px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); margin-bottom:5px}
.prm input,.prm select{width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--line-c);
  background:var(--card); color:var(--ink); font:inherit; font-size:14px}
.norm-out{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin-top:4px}
.norm-out div{padding:10px 11px; background:var(--mint); border:1px solid var(--line-c); border-radius:var(--r3)}
.norm-out .lbl{display:block; margin-bottom:3px}
.norm-out b{font-family:"JetBrains Mono",monospace; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums}
.norm-out s{text-decoration:none; font-size:11px; color:var(--ink3)}
.hist{display:flex; flex-direction:column; gap:0}
.hist-row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:baseline;
  padding:8px 0; border-bottom:1px solid var(--line); font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-row .d{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink3)}
.hist-row b{font-family:"JetBrains Mono",monospace; font-weight:700}
.hist-row .dt{font-family:"JetBrains Mono",monospace; font-size:12px}
.dn{color:var(--kcal)} .up{color:var(--prot-ink)}

/* ---------- замены в дне ---------- */
.meal.sw{border-color:var(--lime); background:var(--lime-soft)}
.swap-btn{display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:99px;
  border:1px solid var(--line-c); background:var(--card); color:var(--ink3);
  font-family:Nunito,sans-serif; font-size:10.5px; font-weight:700; white-space:nowrap}
.swap-btn:hover{background:var(--lime); color:var(--on-lime); border-color:var(--lime)}
.swap-btn svg{width:12px; height:12px}
.swap-btn[aria-expanded="true"]{background:var(--lime); color:var(--on-lime); border-color:var(--lime)}
.swp{grid-column:1 / -1; margin-top:10px; padding:13px; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r2); display:flex; flex-direction:column; gap:12px}
.swp-g{display:flex; flex-direction:column; gap:6px}
.swp-g > .lbl{display:flex; align-items:center; gap:7px}
.swp-g > .lbl i{flex:1 1 auto; height:1px; background:var(--line); display:block}
.opt{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; width:100%;
  padding:9px 11px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r3); text-align:left}
.opt:hover{border-color:var(--lime); background:var(--lime-soft)}
.opt h5{font-size:13px; font-weight:700; line-height:1.25}
.opt .s{font-size:11px; color:var(--ink3); margin-top:2px; line-height:1.35}
.opt .kk{font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:700; color:var(--ink2); white-space:nowrap}
.subs{display:flex; flex-wrap:wrap; gap:5px}
.subs .src{font-size:11.5px; color:var(--ink2); padding:4px 0; width:100%}
.subs .src b{font-weight:700; color:var(--ink)}
.sub-b{padding:5px 10px; border-radius:99px; border:1px solid var(--line-c); background:var(--mint);
  font-size:11.5px; color:var(--ink2)}
.sub-b:hover{background:var(--lime); color:var(--on-lime); border-color:var(--lime)}
.sub-b b{font-family:"JetBrains Mono",monospace; font-weight:700}
.swapped-tag{font-family:Nunito,sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--kcal); background:var(--card); border:1px solid var(--lime);
  padding:2px 7px; border-radius:99px}
.mini-steps{margin:0; padding-left:17px; font-size:11.5px; color:var(--ink2); display:flex; flex-direction:column; gap:4px}

/* ---------- блюдо ---------- */
.dish-h{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 15px;
  background:var(--lime-soft); border:1px solid var(--lime); border-radius:var(--r2); margin-bottom:11px}
.dish-h h3{font-size:17px; font-weight:800; line-height:1.25; flex:1 1 200px; min-width:0}
.dish-h .meta{display:flex; gap:6px; flex-wrap:wrap}
.side-h{display:flex; align-items:center; gap:8px; margin:13px 0 7px}
.side-h span{font-family:Nunito,sans-serif; font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink3)}
.side-h i{flex:1 1 auto; height:1px; background:var(--line); display:block}
.howto{margin-top:12px; padding:14px 15px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r2)}
.howto h4{font-size:13px; font-weight:800; margin-bottom:9px; display:flex; align-items:center; gap:7px}
.howto h4 svg{width:15px; height:15px; color:var(--kcal)}
.howto ol{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:7px}
.howto li{font-size:13px; color:var(--ink2); line-height:1.45}
.howto li::marker{font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--kcal)}
.dish-pick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:11px}
.dish-pick button{padding:6px 11px; border-radius:99px; border:1px solid var(--line-c); background:var(--mint);
  font-family:Nunito,sans-serif; font-weight:700; font-size:12px; color:var(--ink2)}
.dish-pick button:hover{background:var(--lime); color:var(--on-lime); border-color:var(--lime)}
.dish-pick button[aria-pressed="true"]{background:var(--lime); color:var(--on-lime); border-color:var(--lime)}

/* ---------- конструктор ---------- */
.cons{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,300px); gap:16px; align-items:start}
.cons-tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.btn{background:var(--lime); color:var(--on-lime); padding:9px 15px; border-radius:99px;
  font-family:Nunito,sans-serif; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:7px}
.btn:hover{background:var(--lime-d)}
.btn svg{width:14px; height:14px}
.btn-2{background:var(--mint); color:var(--ink2); border:1px solid var(--line-c)}
.btn-2:hover{background:var(--sunk); color:var(--ink)}
.sel{padding:8px 11px; border-radius:9px; border:1px solid var(--line-c); background:var(--field);
  color:var(--ink); font:inherit; font-size:13px; max-width:230px}

.pantry{display:flex; flex-direction:column; gap:2px; max-height:520px; overflow-y:auto; padding-right:4px}
.pantry .lbl{margin:11px 0 4px; position:sticky; top:0; background:var(--card); padding:3px 0; z-index:1}
.pantry .lbl:first-child{margin-top:0}
.pantry label{display:flex; align-items:center; gap:9px; padding:6px 9px; border-radius:8px; font-size:12.5px; color:var(--ink2); cursor:pointer}
.pantry label:hover{background:var(--mint)}
.pantry .kcal{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink3); white-space:nowrap}
.pantry input{appearance:none; width:15px; height:15px; border:1.5px solid var(--line2); border-radius:5px; flex:0 0 auto; display:grid; place-items:center; cursor:pointer}
.pantry input:checked{background:var(--lime); border-color:var(--lime)}
.pantry input:checked::after{content:""; width:7px; height:3.5px; border-left:2px solid var(--on-lime); border-bottom:2px solid var(--on-lime); transform:rotate(-45deg) translate(1px,-1px)}

.comp{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center;
  padding:9px 11px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r3)}
.comp h5{font-size:13px; font-weight:700}
.comp .s{font-size:10.5px; color:var(--ink3); margin-top:2px}
.comp .g{display:flex; align-items:center; gap:5px}
.comp .g button{width:22px; height:22px; border-radius:6px; display:grid; place-items:center; background:var(--card); border:1px solid var(--line2);
  color:var(--ink2); font-family:"JetBrains Mono",monospace; font-weight:700; font-size:13px; line-height:1}
.comp .g button:hover{background:var(--lime); color:var(--on-lime); border-color:var(--lime)}
.comp .g b{font-family:"JetBrains Mono",monospace; font-size:12.5px; min-width:50px; text-align:center}

  padding:10px 12px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r3); width:100%; text-align:left}

.sec{padding:18px}

.sec-h h2{font-size:17px; font-weight:800}
.sec-h .lbl{margin-left:auto}
.lead{color:var(--ink2); font-size:14px; max-width:66ch}

/* ---------- hero (день) ---------- */
.hero{display:grid; grid-template-columns:auto minmax(0,1fr) 180px; gap:20px; padding:20px; align-items:center}
.hero-ring{position:relative; width:148px; height:148px}

/* ---------- бейджи ---------- */
.tag{display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:99px; font-family:Nunito,sans-serif; font-size:11px; font-weight:700; white-space:nowrap}
.tg-br{background:var(--br-bg); color:var(--br)}
.tg-lu{background:var(--lu-bg); color:var(--lu)}
.tg-di{background:var(--di-bg); color:var(--di)}
.tg-sn{background:var(--sn-bg); color:var(--sn)}
.tg-sw{background:var(--sw-bg); color:var(--sw)}
.tg-gym{background:var(--lime-soft); color:var(--kcal)}

/* ---------- строки приёмов ---------- */
.meals{display:flex; flex-direction:column; gap:9px}

.meal-h h4{font-size:15px; font-weight:700}

.macro-mini{display:flex; gap:5px}

.mm-f{background:var(--fat-bg); color:var(--fat-ink)}

/* ---------- недельный график ---------- */
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:8px}
.wk{display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 4px 10px; border-radius:var(--r2); background:var(--mint); border:1px solid var(--line-c); cursor:pointer; text-align:center}

.wk .fill{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,var(--lime),var(--lime-d)); border-radius:7px}
.wk .k{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink2); font-weight:700}
.wk .g{width:5px; height:5px; border-radius:50%; background:var(--kcal)}

/* ---------- нормы ---------- */
.norms{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.norm{padding:16px; border-radius:var(--r2); border:1px solid var(--line-c); background:var(--mint)}

.norm-h .meta{font-size:11px; color:var(--ink3)}
.big{font-family:Nunito,sans-serif; font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1}
.big span{font-family:"Golos Text",sans-serif; font-size:12px; font-weight:500; color:var(--ink3); letter-spacing:0}
.stack{display:grid; grid-template-columns:auto 1fr; font-size:12.5px; margin-top:12px}
.stack dt{padding:6px 0; border-top:1px solid var(--line); color:var(--ink2)}
.stack dd{padding:6px 0; border-top:1px solid var(--line); margin:0; text-align:right; font-family:"JetBrains Mono",monospace; font-weight:500}

/* ---------- правая колонка ---------- */
.rail{position:sticky; top:14px; display:flex; flex-direction:column; gap:14px}

.mini{display:flex; flex-direction:column; gap:8px}
.mini-row{display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 10px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r3)}
.mini-row h5{font-size:12.5px; font-weight:700; line-height:1.25}
.mini-row .s{font-size:10.5px; color:var(--ink3); margin-top:2px}

.cook-i:last-child{border-bottom:none}

.cook-i p{font-size:12px; color:var(--ink2); line-height:1.4}
.cook-i p b{color:var(--ink); font-weight:600}
.cook-i.key{background:var(--carb-bg); border-radius:var(--r3); padding:10px; border-bottom:none; margin-bottom:4px}
.cook-i.key .dd{color:var(--carb-ink)}
.cook-i.key p{color:var(--ink2)}

/* ---------- сетки карточек ---------- */
.grid{display:grid; gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.item{padding:13px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r2); display:flex; flex-direction:column; gap:7px}
.item h4{font-size:14px; font-weight:700; line-height:1.3}
.item .q{font-size:11.5px; color:var(--ink3); line-height:1.4; flex:1 1 auto}
.item .n{font-size:11.5px; color:var(--ink2); font-style:italic}

/* ---------- рецепты ---------- */
.rec{background:var(--soft); border:1px solid var(--line); border-radius:var(--r2); overflow:hidden}
summary{list-style:none; cursor:pointer}
summary::-webkit-details-marker{display:none}
.rec-h{display:grid; grid-template-columns:44px minmax(0,1fr) auto auto; gap:12px; align-items:center; padding:12px 14px; width:100%; text-align:left}
.rec-h:hover{background:var(--mint)}
.rec-h h4{font-size:15px; font-weight:700}
.rec-h .g{font-size:11px; color:var(--ink3); margin-top:2px}
.rec-h .chev{width:16px; height:16px; color:var(--ink3); transition:transform .18s}
.rec[open] .chev{transform:rotate(180deg)}
.rec-b{padding:0 14px 14px; display:grid; grid-template-columns:minmax(0,260px) minmax(0,1fr); gap:20px}
.rec-b h5{margin:0 0 7px; font-family:Nunito,sans-serif; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3)}
.ing{display:flex; flex-direction:column; gap:0}
.ing li{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px dotted var(--line2); font-size:12.5px; color:var(--ink2); list-style:none}
.ing li span{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink3); white-space:nowrap}
.ing{margin:0; padding:0}
.steps{margin:0; padding-left:17px; font-size:12.5px; color:var(--ink2); display:flex; flex-direction:column; gap:5px}
.rec-f{margin:12px 14px 14px; padding:11px 12px; background:var(--card); border:1px solid var(--line); border-radius:var(--r3); display:flex; gap:16px; flex-wrap:wrap; align-items:center}
.rec-f .fx{font-size:11px; color:var(--ink3)}
.rec-f .fx b{display:block; font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--ink); font-weight:700; margin-top:2px}
.rec-f .hint{flex:1 1 220px; font-size:11.5px; color:var(--ink2); font-style:italic; min-width:180px}

/* ---------- покупки ---------- */
.shopg{display:flex; flex-direction:column; gap:2px}
.shopg .lbl{margin:12px 0 5px}
.shopg label{display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; font-size:13px; color:var(--ink2); cursor:pointer}

.shopg input:checked::after{content:""; width:8px; height:4px; border-left:2px solid var(--on-lime); border-bottom:2px solid var(--on-lime); transform:rotate(-45deg) translate(1px,-1px)}
.shopg input:checked + span{text-decoration:line-through; color:var(--ink3)}
.shopg label .amt{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink3); white-space:nowrap}

/* ---------- заметки ---------- */
.split{display:flex; flex-direction:column; gap:0}

  padding:6px 0; border-bottom:1px dotted var(--line2)}
.split > div:last-child{border-bottom:none}
.split .sh{border-bottom:1px solid var(--line2); padding-bottom:5px}
.split .sh span,.split .sh b,.split .sh i{font-family:Nunito,sans-serif; font-size:9.5px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); font-style:normal}
.split span{font-size:12.5px; color:var(--ink2); min-width:0; overflow-wrap:anywhere}
.split b,.split i{font-family:"JetBrains Mono",monospace; font-size:12px; font-variant-numeric:tabular-nums;
  text-align:right; white-space:nowrap; font-style:normal}
.split b{font-weight:700; color:var(--kcal)}

.split .tot{border-top:1px solid var(--line2); border-bottom:none; margin-top:2px; padding-top:8px}

.sub{margin-top:8px}

  color:var(--kcal); list-style:none}

  letter-spacing:.1em; text-transform:uppercase; color:var(--ink3)}

.notes{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.note-c{padding:14px; background:var(--soft); border:1px solid var(--line); border-radius:var(--r2)}

.callout{padding:14px 16px; border-radius:var(--r2); background:var(--carb-bg); border:1px solid var(--carb); border-left-width:3px; font-size:13px; color:var(--ink2); margin-bottom:12px}

.meter{display:flex; gap:3px; align-items:center}
.meter i{width:5px; height:5px; border-radius:50%; background:var(--line2)}
.meter i.on{background:var(--dot)}

/* донат макросов: доли по калорийности Б/Ж/У */
function donut(p,f,c,size,thick){
  const kp=p*4, kf=f*9, kc=c*4, t=kp+kf+kc||1;
  const r=(size-thick)/2, C=2*Math.PI*r, cx=size/2;
  const segs=[[kp,'var(--prot)'],[kf,'var(--fat)'],[kc,'var(--carb)']]; // белок · жиры · углеводы
  let off=0, out='';
  for(const [v,col] of segs){
    const len=C*v/t;
    if(len<=0.3){ off+=len; continue; }
    out+=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${col}" stroke-width="${thick}" stroke-linecap="round"
      stroke-dasharray="${Math.max(0,len-2).toFixed(2)} ${(C-len+2).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off+=len;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)" aria-hidden="true">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="${thick}"/>${out}</svg>`;
}

function density(p,k){ return k? p/k*100 : 0; }
function meter(p,k){
  const d=density(p,k), n=Math.max(1,Math.min(10,Math.round(d)));
  let dots=''; for(let i=0;i<10;i++) dots+=`<i class="${i<n?'on':''}"></i>`;
  return `<span class="meter" title="Белка на 100 ккал">${dots}<em>${d.toFixed(1)} Б/100</em></span>`;
}

function searchAll(raw){
  const q = raw.trim().toLowerCase();
  if(q.length < 2) return null;
  const hit = t => String(t).toLowerCase().includes(q);
  const meals = [];
  PLAN.days.forEach((d,di) => d.meals.forEach(m => {
    if(hit(m.title) || hit(m.note) || hit(m[who].qty)) meals.push({d,di,m});
  }));
  const recipes = [];
  PLAN.recipes.forEach((r,ri) => {
    if(hit(r.title) || hit(r.gear) || r.ing.some(i => hit(i.n)) || r.steps.some(hit) || hit(r.hint)) recipes.push({r,ri});
  });
  const snacks = PLAN.snacks.filter(x => hit(x.title) || hit(x.qty) || hit(x.note));
  const sweets = PLAN.sweets.filter(x => hit(x.title) || hit(x.qty) || hit(x.note));
  const shop = [];
  SHOP.forEach(([t,,groups]) => groups.forEach(([g,items]) => items.forEach(([n,amt]) => {
    if(hit(n)) shop.push({t,g,n,amt});
  })));
  return {q, meals, recipes, snacks, sweets, shop,
          total: meals.length + recipes.length + snacks.length + sweets.length + shop.length};
}

function calcNorm(p){
  if(!p || !(p.wt > 25) || !(p.h > 100) || !(p.age > 10)) return null;
  const bmr  = 10 * p.wt + 6.25 * p.h - 5 * p.age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * (p.act || 1.375);
  const kcal = Math.round(tdee * (1 - (p.def || 12) / 100) / 5) * 5;
  const prot = Math.round(p.wt * (p.gk || 1.8));
  const fat  = Math.round(p.wt * (p.fk || 0.9));
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  return { bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, prot, fat, carb };
}
/* норма человека: своя, если параметры заданы, иначе базовая из плана */
function person(k){
  const base = PLAN.people[k], p = profiles[k], n = calcNorm(p);
  if(!n) return base;
  return Object.assign({}, base, {
    custom:true, tdee:n.tdee, bmr:n.bmr, kcal:n.kcal, prot:n.prot, fat:n.fat, carb:n.carb,
    deficit: p.def || 12,
    gkg: Math.round(n.prot / p.wt * 100) / 100,
    meta: 'мои параметры',
    note: 'пересчитано на вес ' + String(p.wt).replace('.', ',') + ' кг'
  });
}

const scaleOf = k => person(k).kcal / PLAN.people[k].kcal;
function scaleQty(text, f){
  return String(text).replace(/(\d+(?:[.,]\d+)?)\s*(г|шт|мл)/g, (m0, num, unit) => {
    const v = parseFloat(num.replace(',', '.')) * f;
    return (unit === 'шт' ? Math.max(1, Math.round(v)) : Math.max(5, Math.round(v / 5) * 5)) + ' ' + unit;
  });
}
const targetFor = (k, dayId) => Math.round(PLAN.targets[k][dayId] * scaleOf(k) / 5) * 5;

/* ================= напитки =================
   Кофе с молоком дважды в день — это 60–150 ккал, и на дефиците они
   решают. Держим их отдельной строкой бюджета: еда ужимается ровно
   на столько, сколько выпито, а день по-прежнему сходится в норму. */
function drinkTotals(k){
  const d = (profiles[k] || {}).drinks;
  if(!d || !(d.cups > 0)) return { k:0, p:0, f:0, c:0, cups:0, per:null };
  const f = FOOD[d.milk] || FOOD['молоко 2,5%'];
  const ml = d.ml || 0, sug = d.sugar || 0;
  const per = {
    k: (f ? f.k * ml / 100 : 0) + sug * 4 + 2,      // 2 ккал — сам кофе или чай
    p: (f ? f.p * ml / 100 : 0),
    f: (f ? f.f * ml / 100 : 0),
    c: (f ? f.c * ml / 100 : 0) + sug
  };
  return { k:per.k * d.cups, p:per.p * d.cups, f:per.f * d.cups, c:per.c * d.cups,
           cups:d.cups, ml, sug, milk:(f ? f.n : null), per };
}
/* сколько калорий остаётся собственно на еду */
const foodKcal = k => Math.max(person(k).kcal * 0.5, person(k).kcal - drinkTotals(k).k);
/* во сколько раз ужимаются навески: и личная норма, и выпитое */
function mealFactor(k, dayId){
  const base = PLAN.targets[k][dayId];
  const drink = drinkTotals(k).k * (targetFor(k, dayId) / person(k).kcal);
  return Math.max(0.5, (targetFor(k, dayId) - drink) / base);
}

function sumOf(list){
  return list.reduce((a, x) => {
    const f = FOOD[x.n]; if(!f) return a;

  }, {k:0, p:0, f:0, c:0});
}
function roundG(f, g){

  return Math.max(5, Math.round(g / 5) * 5);
}
function have(cat){ return allFoods().filter(f => f.cat === cat && pantry[f.n]); }

function slotPool(sl){
  let pool = allFoods().filter(f => pantry[f.n]);
  if(sl.only) pool = pool.filter(f => sl.only.indexOf(f.n) >= 0);
  if(sl.cat)  pool = pool.filter(f => f.cat === sl.cat);
  if(sl.not)  pool = pool.filter(f => sl.not.indexOf(f.n) < 0);
  return pool;
}
const dishFits = t => t.slots.every(sl => !sl.req || slotPool(sl).length > 0);

/* Минимальная калорийность блюда: обязательные роли на нижней границе
   навески, самым лёгким из доступных продуктов. Сырники физически не
   влезают в перекус на 170 ккал — их не надо и предлагать. */
function minKcal(t){
  let sum = 0;
  for(const sl of t.slots){
    const pool = slotPool(sl);
    if(!pool.length){ if(sl.req) return Infinity; continue; }
    let best = Infinity;
    for(const f of pool){
      const g = f.unit ? Math.max(f.unit, sl.lo || 5) : (sl.lo || 5);
      best = Math.min(best, f.k * g / 100);
    }
    sum += best;
  }
  return sum;
}
function dishesFor(meal, aimK){
  const ceil = (aimK || aimFor(meal).k) * 1.05;
  return DISHES.filter(t => t.meals.indexOf(meal) >= 0 && dishFits(t) && minKcal(t) <= ceil);
}

/* Подгонка калорий: на каждом проходе делаем один шаг — тот, что сильнее
   приближает к цели. Шаг «первый подходящий» застревал на штучных
   продуктах, где яйцу нужно было полштуки. */
function fitKcal(list, target){
  for(let pass = 0; pass < 10; pass++){
    const cur = sumOf(list).k, diff = target - cur;
    if(Math.abs(diff) <= target * 0.04) break;
    let best = null;
    for(const it of list){
      if(!it.flex) continue;
      const f = FOOD[it.n];
      if(!f || f.k <= 0) continue;
      const ng = roundG(f, Math.min(Math.max(it.g + diff / (f.k / 100), it.lo), it.hi));
      if(ng === it.g) continue;
      const after = Math.abs(target - (cur + f.k * (ng - it.g) / 100));
      if(after < Math.abs(diff) - 1 && (!best || after < best.d)) best = { it, ng, d: after };
    }
    if(!best) break;
    best.it.g = best.ng;
  }
}

/* Образец блюда для каталога рецептов. В отличие от сборки в конструкторе
   берёт продукты из всей базы, а не из кладовки, и выбирает их без случайности —
   чтобы список не перетасовывался при каждой перерисовке. */
function previewDish(tpl){
  const meal = tpl.meals[0], aim = aimFor(meal), parts = [];
  for(const sl of tpl.slots){
    let pool = allFoods();
    if(sl.only) pool = pool.filter(f => sl.only.indexOf(f.n) >= 0);
    if(sl.cat)  pool = pool.filter(f => f.cat === sl.cat);
    if(sl.not)  pool = pool.filter(f => sl.not.indexOf(f.n) < 0);
    if(!pool.length){ if(sl.req) return null; continue; }
    const f = pool[0];
    if(parts.some(x => x.n === f.n)) continue;
    parts.push({ n:f.n, g:roundG(f, sl.base), r:sl.r, lo:sl.lo || 5, hi:sl.hi || 260, flex:!!sl.flex });
  }
  if(!tpl.slots.every(sl => !sl.req || parts.some(x => x.r === sl.r))) return null;
  fitKcal(parts, aim.k);
  return { parts, aim, meal, v: sumOf(parts) };
}

function assembleDish(meal, wantId, aimOverride){
  const aim = aimOverride || aimFor(meal);
  const cands = wantId ? DISHES.filter(t => t.id === wantId && dishFits(t)) : dishesFor(meal, aim.k);
  if(!cands.length) return null;
  const t = pick(cands);
  const parts = [];
  for(const sl of t.slots){
    const pool = slotPool(sl);
    if(!pool.length){ if(sl.req) return null; continue; }
    const f = pick(pool);
    if(parts.some(x => x.n === f.n)) continue;          // один продукт в двух ролях не нужен
    parts.push({ n:f.n, g:roundG(f, sl.base), r:sl.r, lo:sl.lo || 5, hi:sl.hi || 260, flex:!!sl.flex });
  }
  if(!t.slots.every(sl => !sl.req || parts.some(x => x.r === sl.r))) return null;

  /* главный компонент задаёт белок, остальное подгоняется по калориям */
  const mainIt = parts.find(x => x.r === 'main' || x.r === 'curd' || x.r === 'prot');
  if(mainIt){
    const f = FOOD[mainIt.n];
    if(f.p > 0){
      const gp = Math.min(aim.p * 0.8 / (f.p / 100), aim.k * 0.65 / (f.k / 100));
      mainIt.g = roundG(f, Math.min(Math.max(gp, mainIt.lo), mainIt.hi));
      if(f.p >= 5) mainIt.hi = Math.max(mainIt.g, roundG(f, aim.p * 1.25 / (f.p / 100)));
    }
  }
  fitKcal(parts, aim.k);

  /* Перебор по белку ловим по факту, а не по имени роли: в смузи-боуле его
     несут и творог, и протеин, и вместе они давали 52 г при цели 31. */
  for(let guard = 0; guard < 4; guard++){
    const tot = sumOf(parts);
    if(tot.p <= aim.p * 1.5) break;
    let top = null;
    for(const x of parts){
      if(!x.flex) continue;
      const f = FOOD[x.n], pg = f.p * x.g / 100;
      if(f.p > 0 && (!top || pg > top.pg)) top = { x, pg, f };
    }
    if(!top) break;
    const ng = roundG(top.f, Math.max(top.x.lo, top.x.g - (tot.p - aim.p * 1.3) / (top.f.p / 100)));
    if(ng >= top.x.g) break;
    top.x.g = ng;
    top.x.hi = ng;            // иначе подбор калорий тут же вернёт его обратно
    fitKcal(parts, aim.k);
  }

  /* Перебор даже на минимуме — снимаем необязательные компоненты, начиная
     с самого калорийного. Иначе на сладкое в 90 ккал предлагалось джелато
     с бананом и протеином на 167. */
  for(let guard = 0; guard < 4; guard++){
    if(sumOf(parts).k - aim.k <= aim.k * 0.08) break;
    const optional = parts.filter(x => !t.slots.some(sl => sl.r === x.r && sl.req));
    if(!optional.length) break;
    let worst = null;
    for(const x of optional){
      const k = FOOD[x.n].k * x.g / 100;
      if(!worst || k > worst.k) worst = { x, k };
    }
    parts.splice(parts.indexOf(worst.x), 1);
    fitKcal(parts, aim.k);
  }

  /* вприкуску: то, что не влезло в блюдо, но нужно по калориям */
  const side = [];
  const rest = aim.k - sumOf(parts).k;
  if(rest >= 60){
    const pool = allFoods().filter(f => pantry[f.n] && SIDE_OK.indexOf(f.n) >= 0 && !parts.some(x => x.n === f.n));
    if(pool.length){
      const f = pick(pool);
      side.push({ n:f.n, g:roundG(f, Math.min(Math.max(rest / (f.k / 100), f.unit || 10), 130)),
                  r:'side', lo:f.unit || 5, hi:150, flex:true, side:true });
      fitKcal(parts.concat(side), aim.k);
    }
  }
  return { tpl:t, items: parts.concat(side) };
}

/* шаги готовки по текущему составу — пересчитываются после ручных правок */
function stepsFor(tpl, items){
  if(!tpl) return null;
  const S = {};
  for(const x of items) if(x.r && !x.side) S[x.r] = x;
  if(tpl.slots.filter(sl => sl.req && !S[sl.r]).length) return { broken:true };
  try { return { title: tpl.title.replace(/\{(\w+)(?::(\d))?\}/g, (_, r, c) => S[r] ? word(S[r].n, c ? +c : 0) : ''), steps: tpl.steps(S) }; }
  catch(e){ return { broken:true }; }
}
const dishById = id => DISHES.find(t => t.id === id) || null;
function dishSteps(){ return builtTpl ? stepsFor(builtTpl, built) : null; }

/* ================= замены в дне =================
   План — не приговор: если продукта нет или блюдо надоело, приём меняется
   на равный по калориям и белку. Замена живёт в браузере и отдельная
   для каждого человека — порции у них разные. */

const swapKey = (di, mi, k) => (k || who) + '|' + PLAN.days[di].id + '.' + mi;

function parseQty(text){
  return String(text).split(', ').map(t => {
    const mm = t.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(г|шт)$/);
    if(!mm) return null;
    const f = FOOD[mm[1].trim()];
    if(!f) return null;
    const num = parseFloat(mm[2].replace(',', '.'));
    return { n: mm[1].trim(), g: mm[3] === 'шт' ? num * (f.unit || 1) : num, lo: 5, hi: 500, flex: true };
  }).filter(Boolean);
}
const qtyText = items => items.map(x => word(x.n) + ' ' + gOf(x)).join(', ');

function scaleParts(parts, targetK){
  const cur = sumOf(parts).k;
  if(cur > 0){
    const f = targetK / cur;
    for(const x of parts) x.g = roundG(FOOD[x.n], x.g * f);
  }
  fitKcal(parts, targetK);
  return parts;
}

/* что стоит в приёме сейчас: план или уже поставленная замена */
function mealView(di, mi, k){
  k = k || who;
  const m = PLAN.days[di].meals[mi];
  const sw = swaps[swapKey(di, mi, k)];
  if(!sw || !sw.items || !sw.items.length){
    const f = mealFactor(k, PLAN.days[di].id), v = m[k];
    if(Math.abs(f - 1) < 0.005)
      return { title:m.title, note:m.note, label:m.label, qty:v.qty, v, swapped:false };
    return { title:m.title, note:m.note, label:m.label, swapped:false, scaled:true,
             qty: scaleQty(v.qty, f),
             v: { k:Math.round(v.k*f), p:Math.round(v.p*f), f:Math.round(v.f*f), c:Math.round(v.c*f) } };
  }
  const s = sumOf(sw.items);
  return {
    title: sw.title, note: sw.note || '', label: m.label, qty: qtyText(sw.items),
    v: { k:Math.round(s.k), p:Math.round(s.p), f:Math.round(s.f), c:Math.round(s.c) },
    swapped: true, tplId: sw.tplId, items: sw.items, parts: sw.parts
  };
}
function dayTotals(di, k){
  k = k || who;
  const dr = drinkTotals(k);
  return PLAN.days[di].meals.reduce((a, _, mi) => {
    const v = mealView(di, mi, k).v;
    a.k += v.k; a.p += v.p; a.f += v.f; a.c += v.c; return a;
  }, { k:Math.round(dr.k), p:Math.round(dr.p), f:Math.round(dr.f), c:Math.round(dr.c) });
}

/* ================= на двоих =================
   Готовим один раз, а норм две. У плиты нужны два разных числа: сколько
   продуктов взять всего — и сколько потом положить каждому. Складываем
   навески обоих и сразу показываем, как делить готовое. */

const RECIPE = {};
PLAN.recipes.forEach(r => { RECIPE[r.key] = r; });

/* Заготовки и «кухонные» продукты в кладовке конструктора не лежат,
   а в навесках и рецептах стоят наравне со всеми. Здесь они находятся. */
const BASE = PLAN.base || {};
function anyFood(n){
  const f = FOOD[n];
  if(f) return f;
  const r = RECIPE[n];
  if(r) return { n, k:r.per100.k, p:r.per100.p, f:r.per100.f, c:r.per100.c, batch:true };
  const b = BASE[n];
  return b ? { n, k:b.k, p:b.p, f:b.f, c:b.c } : null;
}
function splitParts(text){
  const out = [];
  String(text).split(', ').forEach(t => {
    const mm = t.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(г|шт|мл)$/);
    if(!mm) return;
    const n = mm[1].trim(), f = anyFood(n), num = parseFloat(mm[2].replace(',', '.'));
    out.push({ n, g: mm[3] === 'шт' ? num * ((f && f.unit) || 1) : num });
  });
  return out;
}
function partsOfMeal(di, mi, k){
  const V = mealView(di, mi, k);
  return { V, parts: (V.items && V.items.length)
    ? V.items.map(x => ({ n:x.n, g:x.g, r:x.r })) : splitParts(V.qty) };
}
const gTxt = (n, g) => {
  const f = anyFood(n);
  return f && f.unit ? Math.round(g / f.unit) + ' шт' : Math.round(g) + ' г';
};
/* один приём на двоих: общий вес по каждому продукту и деление по тарелкам */
function pairMeal(di, mi){
  const A = partsOfMeal(di, mi, 'm'), B = partsOfMeal(di, mi, 'w');
  const together = A.V.title === B.V.title && (A.V.tplId || '') === (B.V.tplId || '');
  const map = new Map();
  const add = (parts, key) => parts.forEach(x => {
    const e = map.get(x.n) || { n:x.n, m:0, w:0 };
    e[key] += x.g; map.set(x.n, e);
  });
  add(A.parts, 'm'); add(B.parts, 'w');
  const rows = Array.from(map.values()).map(e => Object.assign(e, { g: e.m + e.w }));
  const kk = A.V.v.k + B.V.v.k;
  return { di, mi, A, B, rows, together, k:kk, share: kk > 0 ? Math.round(A.V.v.k / kk * 100) : 50 };
}
/* порядок готовки, пересчитанный на общий вес: одна сковорода на двоих */
function pairSteps(P){
  if(!P.together || !P.A.V.tplId || !P.A.V.items || !P.B.V.items) return null;
  const used = [];
  const merged = P.A.V.items.map(x => {
    const i = P.B.V.items.findIndex((y, j) => y.n === x.n && y.r === x.r && used.indexOf(j) < 0);
    if(i >= 0) used.push(i);
    return Object.assign({}, x, { g: x.g + (i >= 0 ? P.B.V.items[i].g : 0) });
  });
  const st = stepsFor(dishById(P.A.V.tplId), merged);
  return st && !st.broken ? st : null;
}
/* весь день одним списком: что достать из заготовок, что взвесить свежим */
function pairDay(di){
  const map = new Map();
  PLAN.days[di].meals.forEach((_, mi) => pairMeal(di, mi).rows.forEach(r => {
    const e = map.get(r.n) || { n:r.n, m:0, w:0, g:0 };
    e.m += r.m; e.w += r.w; e.g += r.g; map.set(r.n, e);
  }));
  const all = Array.from(map.values()).sort((a, b) => b.g - a.g);
  return { batch: all.filter(x => RECIPE[x.n]), fresh: all.filter(x => !RECIPE[x.n]) };
}
/* молоко в чашках — тоже общий расход, его удобно знать заранее */
function pairDrinks(){
  const a = drinkTotals('m'), b = drinkTotals('w');
  if(!a.cups && !b.cups) return null;
  const ml = k => (k.cups || 0) * (k.ml || 0), sg = k => (k.cups || 0) * (k.sug || 0);
  return { cups:(a.cups || 0) + (b.cups || 0), ml:ml(a) + ml(b), sug:sg(a) + sg(b),
           k:a.k + b.k, milk:a.milk || b.milk, a, b };
}

/* варианты замены под КБЖУ именно этого приёма */
function swapOptions(di, mi){
  const m = PLAN.days[di].meals[mi];
  const aim = { k: m[who].k, p: m[who].p };
  const label = (m.label === 'Вечер' || m.label === 'Перекус') ? 'Перекус' : m.label;

  const dishes = [], seen = new Set();
  for(let t = 0; t < 120 && dishes.length < 3; t++){
    const r = assembleDish(label, null, aim);
    if(!r || seen.has(r.tpl.id)) continue;
    const v = sumOf(r.items);
    if(Math.abs(v.k - aim.k) > aim.k * 0.15) continue;
    seen.add(r.tpl.id);
    dishes.push({ tpl:r.tpl, items:r.items, v });
  }

  const small = aim.k <= 320;                 // размер перекуса, а не полноценного приёма
  const bank = label === 'Перекус' ? PLAN.snacks.concat(PLAN.sweets) : PLAN.snacks;
  const light = [];
  for(const x of small ? bank : []){
    const parts = parseQty(x.qty);
    if(!parts.length) continue;
    if(x.k > aim.k * 1.4 || x.k < aim.k * 0.7) continue;   // дальше растягивать — уже нелепо
    const was = parts.map(y => y.g);
    const items = scaleParts(parts, aim.k);
    if(Math.abs(sumOf(items).k - aim.k) > aim.k * 0.15) continue;
    if(items.some((y, i) => y.g > was[i] * 1.6 || y.g < was[i] * 0.55)) continue;
    light.push({ title:x.title, items, note:x.note });
    if(light.length >= 4) break;
  }

  /* два перекуса вместо одного: половина калорий на каждый */
  let split = null;
  const half = aim.k / 2;
  const fit = small ? PLAN.snacks.filter(x => parseQty(x.qty).length && x.k <= half * 1.8 && x.k >= half * 0.5) : [];
  if(fit.length >= 2){
    const a = fit[Math.floor(Math.random() * fit.length)];
    const rest = fit.filter(x => x.title !== a.title);
    const b = rest[Math.floor(Math.random() * rest.length)];
    const pa = parseQty(a.qty), pb = parseQty(b.qty);
    const wa = pa.map(y => y.g), wb = pb.map(y => y.g);
    split = [{ title:a.title, items:scaleParts(pa, half) },
             { title:b.title, items:scaleParts(pb, half) }];
    const tot = sumOf(split[0].items.concat(split[1].items)).k;
    const wild = split[0].items.some((y, i) => y.g > wa[i] * 1.8 || y.g < wa[i] * 0.4) ||
                 split[1].items.some((y, i) => y.g > wb[i] * 1.8 || y.g < wb[i] * 0.4);
    if(Math.abs(tot - aim.k) > aim.k * 0.2 || wild) split = null;
  }
  return { aim, dishes, light, split };
}

/* чем заменить конкретный продукт: та же роль, равные калории,
   а для белковых — равный белок, иначе замена ломает норму */
function subsFor(name, grams){
  const f = FOOD[name];
  if(!f) return [];
  if(f.k * grams / 100 < 25) return [];          // мелочь вроде 6 г какао заменять незачем
  const byProtein = f.cat === 'Белок' && f.p >= 8;
  const src = byProtein ? f.p * grams / 100 : f.k * grams / 100;
  /* внутри белка держим подгруппу: творог меняется на йогурт, а не на фарш —
     по граммам белка это одно и то же, а по смыслу в десерте нет мяса*/
  const grp = n => /творог|йогурт|протеин|кефир|молоко|сыр|сметана/.test(n) ? 'молочное'
    : /фарш|филе|бедро/.test(n) ? 'мясо'
    : /минтай|треска|тунец|хек/.test(n) ? 'рыба'
    : /яйцо/.test(n) ? 'яйцо' : 'прочее';
  const g0 = grp(name);
  const near = x => (grp(x.n) === g0 ? 0 : 100) +
    Math.abs(x.p - f.p) + Math.abs(x.f - f.f) + Math.abs(x.c - f.c);
  return allFoods()
    .filter(x => x.n !== name && x.cat === f.cat && pantry[x.n] && (byProtein ? x.p >= 4 : x.k > 0))
    .sort((a, b) => near(a) - near(b))            // сначала близкие по составу
    .map(x => {
      const g = roundG(x, byProtein ? src / (x.p / 100) : src / (x.k / 100));
      return { n:x.n, g, k:Math.round(x.k * g / 100), p:Math.round(x.p * g / 100) };
    })
    .filter(x => x.g >= 5 && x.g <= 400)
    .slice(0, 4);
}

function applySwap(di, mi, data){
  swaps[swapKey(di, mi)] = data;
  store.set('kotel.swaps', swaps);
  openSwap = null;
}
function dropSwap(di, mi){
  delete swaps[swapKey(di, mi)];
  store.set('kotel.swaps', swaps);
}

function fromMeal(di, mi){
  const m = PLAN.days[di].meals[mi];
  const parts = m[who].qty.split(', ').map(t => {
    const mm = t.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(г|шт)$/);
    if(!mm) return null;
    const name = mm[1].trim(), num = parseFloat(mm[2].replace(',', '.'));
    const f = FOOD[name];
    if(!f) return null;
    return { n: name, g: mm[3] === 'шт' ? num * (f.unit || 1) : num };
  }).filter(Boolean);
  return { parts, title: m.title, unknown: m[who].qty.split(', ').length - parts.length };
}

function pageCons(){
  const aim = aimFor(aimMeal);
  const tot = sumOf(built);
  const pct = v => Math.min(140, Math.round(v));

  else if(!built.length) verdict = 'Нажмите «Собрать» — конструктор подберёт блюдо из отмеченных продуктов, посчитает навеску под норму и покажет порядок готовки. Можно выбрать блюдо самому кнопками выше или взять готовый приём из меню.';
  else if(Math.abs(dk) <= aim.k * 0.07 && dp >= -4) { verdict = `Попадание в цель: ${dk >= 0 ? '+' : ''}${Math.round(dk)} ккал, белок ${dp >= 0 ? '+' : ''}${Math.round(dp)} г. Так можно есть.`; }
  else if(Math.abs(dk) <= aim.k * 0.15) { vcls = 'v-warn'; verdict = `${dk > 0 ? 'Перебор' : 'Недобор'} ${Math.abs(Math.round(dk))} ккал${dp < -4 ? `, белка не хватает ${Math.abs(Math.round(dp))} г` : ''}. Поправьте граммовку кнопками.`; }
  else { vcls = 'v-bad'; verdict = `${dk > 0 ? 'Перебор' : 'Недобор'} ${Math.abs(Math.round(dk))} ккал — это заметно мимо нормы. Уберите или добавьте компонент.`; }

  const mealOpts = ['Завтрак','Обед','Ужин','Перекус'].map(m =>
    `<option value="${m}"${m === aimMeal ? ' selected' : ''}>${m}</option>`).join('');
  const planOpts = PLAN.days.map((d, di) => d.meals.map((m, mi) =>

      <span class="g"><button type="button" data-g="${i}:-">−</button><b>${f.unit ? Math.round(x.g/f.unit)+' шт' : x.g+' г'}</b><button type="button" data-g="${i}:+">+</button></span>

      </div>` : '') +
    `<div class="res-list">${inDish.map(([x,i]) => compRow(x,i)).join('')}</div>` +
    (asSide.length ? `<div class="side-h"><span>Вприкуску</span><i></i></div>
       <div class="res-list">${asSide.map(([x,i]) => compRow(x,i)).join('')}</div>` : '') +
    (recipe ? (recipe.broken
      ? `<div class="howto"><h4>${svg('pan')}Как приготовить</h4><p style="font-size:13px;color:var(--ink2)">Состав изменён так, что рецепт «${esc(builtTpl.short)}» больше не собирается — не хватает обязательного компонента. Нажмите «Собрать» заново или верните убранное.</p></div>`
      : `<div class="howto"><h4>${svg('pan')}Как приготовить</h4><ol>${recipe.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>`) : '')
  ) : `<p class="empty"><b>Пусто</b>Отметьте продукты справа и нажмите «Собрать» — получите блюдо с навеской и порядком готовки.</p>`;

  const menuDishes = dishesFor(aimMeal);

  const cats = [...new Set(list.map(f => f.cat))];
  const onCount = list.filter(f => pantry[f.n]).length;
  const catOpts = cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const form = showForm ? `
    <div class="ffm">

      <div class="wide"><label for="fc">Категория</label><select id="fc">${catOpts}</select></div>

      <p class="msg ${formMsg ? (formMsg[0] === '!' ? 'err' : 'warn') : 'hint'}">${formMsg ? esc(formMsg.replace(/^[!?]/, '')) : 'КБЖУ берите с упаковки, на 100 г. Продукт сразу попадёт в кладовку и будет участвовать в сборке.'}</p>
      <div class="row"><button type="button" class="btn" id="saveFood">Сохранить</button><button type="button" class="btn btn-2" id="cancelFood">Отмена</button></div>
    </div>` : '';

  return `
  <div class="card sec">
    <div class="sec-h"><h2>Конструктор приёма</h2><span class="lbl">цель: ${person(who).name.toLowerCase()} · ${aimMeal.toLowerCase()} · ${nf(aim.k)} ккал · белок ${aim.p} г</span></div>
    <div class="cons-tools">

/* Свой продукт: валидируем то, что реально ломает расчёт, а спорное
   показываем предупреждением и всё равно сохраняем — на упаковках
   сумма макросов часто не сходится с калорийностью. */
function saveDrinks(){
  const val = id => (document.getElementById(id) || {}).value || '';
  const num = id => { const v = parseFloat(String(val(id)).replace(',', '.')); return isNaN(v) ? 0 : v; };
  const pr = Object.assign({}, profiles[who] || {});
  const cups = Math.round(num('dr_cups'));
  if(cups <= 0){ delete pr.drinks; }
  else pr.drinks = { cups, ml: Math.round(num('dr_ml')), sugar: Math.round(num('dr_sugar')), milk: val('dr_milk') || 'молоко 2,5%' };
  profiles[who] = pr;
  store.set('kotel.profiles', profiles);
  render();
}

function saveProfile(){
  const val = id => (document.getElementById(id) || {}).value || '';
  const num = id => { const v = parseFloat(String(val(id)).replace(',', '.')); return isNaN(v) ? 0 : v; };
  const p = Object.assign({}, profiles[who] || {});
  p.sex = val('pf_sex') || (who === 'm' ? 'm' : 'w');
  p.age = Math.round(num('pf_age'));
  p.h   = Math.round(num('pf_h'));
  p.wt  = Math.round(num('pf_wt') * 10) / 10;
  p.act = num('pf_act') || 1.375;
  const def = num('pf_def'), gk = num('pf_gk');
  p.def = def > 0 ? def : 12;
  p.gk  = gk > 0 ? gk : 1.8;
  p.fk  = p.fk || 0.9;
  if(!calcNorm(p)){ profiles[who] = p; store.set('kotel.profiles', profiles); render(); return; }
  /* журнал: пишем, только если вес поменялся или записи ещё нет */
  const hist = (p.hist || []).slice();
  const today = new Date().toISOString().slice(0, 10);
  const last = hist[hist.length - 1];
  if(!last || Math.abs(last.wt - p.wt) >= 0.1){ hist.push({ d: today, wt: p.wt }); }
  else if(last) { last.d = today; }
  p.hist = hist.slice(-10);
  profiles[who] = p;
  store.set('kotel.profiles', profiles);
  render();
}

function saveFood(){
  const val = id => (document.getElementById(id) || {}).value || '';
  const num = id => { const v = parseFloat(String(val(id)).replace(',', '.')); return isNaN(v) ? 0 : v; };
  const n = val('fn').trim().replace(/["'<>]/g, '');
  const k = num('fk'), p = num('fp'), f = num('ff'), c = num('fu'), unit = Math.round(num('fs'));

  if(n.length < 2){ formMsg = '!Название нужно хотя бы из двух букв.'; render(); return; }
  if(FOOD[n]){ formMsg = '!Продукт «' + n + '» уже есть в списке. Назовите иначе или отредактируйте существующий.'; render(); return; }
  if(k <= 0 || k > 900){ formMsg = '!Калорийность должна быть от 1 до 900 ккал на 100 г.'; render(); return; }
  if(p < 0 || f < 0 || c < 0){ formMsg = '!Макросы не бывают отрицательными.'; render(); return; }
  if(p + f + c > 100){ formMsg = '!Белки, жиры и углеводы вместе не могут весить больше 100 г из 100 г.'; render(); return; }
  if(unit < 0 || unit > 1000){ formMsg = '!Вес штуки — от 1 до 1000 г, либо оставьте поле пустым.'; render(); return; }

  const calc = p * 4 + f * 9 + c * 4;
  const off = Math.abs(calc - k);
  custom.push({ n, cat: val('fc') || 'Белок', k, p, f, c, unit: unit > 0 ? unit : 0, on: true, mine: true });
  pantry[n] = true;
  store.set('kotel.custom', custom); store.set('kotel.pantry', pantry);
  rebuildFood();
  showForm = false;
  formMsg = off > Math.max(25, k * 0.25)
    ? '?Сохранил, но сверьтесь: по макросам выходит ' + Math.round(calc) + ' ккал, а вы указали ' + Math.round(k) + '. Считать буду по вашей цифре.'
    : '';
  render();
}

function pageProfile(){
  const P = person(who), p = profiles[who] || {};
  const base = PLAN.people[who];
  const n = calcNorm(p);
  const hist = (p.hist || []).slice().reverse();
  const fmt = d => { const x = new Date(d); return String(x.getDate()).padStart(2,'0') + '.' + String(x.getMonth()+1).padStart(2,'0') + '.' + x.getFullYear(); };

  let trend = '';
  if(hist.length >= 2){
    const a = hist[0], b = hist[hist.length - 1];
    const days = Math.max(1, Math.round((new Date(a.d) - new Date(b.d)) / 86400000));
    const per = (a.wt - b.wt) / days * 7;
    const dw = a.wt - b.wt;
    const num = v => Math.abs(v).toFixed(v === Math.round(v) ? 0 : 1).replace('.', ',');
    /* «слишком быстро» зависит от массы: 0,7 кг в неделю для 86 кг — норма,
       для 60 кг — уже перебор. Порог берём около 0,9% массы тела. */
    const fast = Math.abs(per) > (p.wt || 70) * 0.009;
    trend = 'За ' + days + ' дн. вес ' + (dw > 0 ? '+' : dw < 0 ? '−' : '') + num(dw) +
      ' кг — это ' + num(per) + ' кг в неделю. ' +
      (Math.abs(per) < 0.05 ? 'Вес стоит. Если так вторую-третью неделю подряд — снимайте 100–150 ккал с углеводов гарнира, но не с белка.'
        : per > 0.15 ? 'Дефицита фактически нет: проверьте, всё ли попадает в счёт.'
        : (per < 0 && fast) ? 'Быстрее, чем стоило бы: на таком темпе уходит не только жир. Добавьте 100–150 ккал обратно.'
        : per < 0 ? 'Темп в рабочем коридоре, так и держите.'
        : 'Небольшой набор — в пределах колебаний воды, смотрите ещё неделю.');
  }

  const rows = [
    ['Пол', `<select id="pf_sex"><option value="w"${p.sex !== 'm' ? ' selected' : ''}>Женский</option><option value="m"${p.sex === 'm' ? ' selected' : ''}>Мужской</option></select>`],
    ['Возраст, лет', `<input id="pf_age" type="number" min="14" max="90" step="1" value="${p.age || ''}" placeholder="31">`],
    ['Рост, см', `<input id="pf_h" type="number" min="120" max="230" step="1" value="${p.h || ''}" placeholder="175">`],
    ['Текущий вес, кг', `<input id="pf_wt" type="number" min="30" max="250" step="0.1" value="${p.wt || ''}" placeholder="80">`]
  ].map(([l, f]) => `<div><label>${l}</label>${f}</div>`).join('');

  const actOpts = ACT.map(([v, t]) => `<option value="${v}"${(p.act || 1.375) == v ? ' selected' : ''}>${t}</option>`).join('');

  return `
  <div class="card sec">
    <div class="sec-h"><h2>Мои параметры</h2><span class="lbl">только в этом браузере</span></div>
    <p class="lead" style="margin-bottom:14px">Вес меняется — меняется и поддержка, и норма белка. Похудели на 5 кг: поддержка упала примерно на 60 ккал, и прежний дефицит стал меньше, чем кажется. Заполните поля — норма пересчитается, а вместе с ней и навески во всём меню. Пусто — работают базовые цифры плана.</p>
    <div class="prm">
      ${rows}
      <div class="wide"><label>Образ жизни</label><select id="pf_act">${actOpts}</select></div>
      <div><label>Дефицит, %</label><input id="pf_def" type="number" min="0" max="30" step="1" value="${p.def === undefined ? '' : p.def}" placeholder="12"></div>
      <div><label>Белок, г на кг</label><input id="pf_gk" type="number" min="1" max="2.5" step="0.05" value="${p.gk === undefined ? '' : p.gk}" placeholder="1,8"></div>
      <div class="wide" style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn" id="pf_save">Пересчитать норму</button>
        ${p.wt ? '<button type="button" class="btn btn-2" id="pf_reset">Сбросить к базовой</button>' : ''}
      </div>
    </div>
    ${n ? `<div class="norm-out" style="margin-top:14px">
      <div><span class="lbl">Обмен покоя</span><b>${nf(n.bmr)}</b> <s>ккал</s></div>
      <div><span class="lbl">Поддержка</span><b>${nf(n.tdee)}</b> <s>ккал</s></div>
      <div><span class="lbl">Норма</span><b>${nf(n.kcal)}</b> <s>ккал</s></div>
      <div><span class="lbl">Белок</span><b>${n.prot}</b> <s>г</s></div>
      <div><span class="lbl">Жиры</span><b>${n.fat}</b> <s>г</s></div>
      <div><span class="lbl">Углеводы</span><b>${n.carb}</b> <s>г</s></div>
    </div>
    <p class="verdict ${Math.abs(scaleOf(who) - 1) > 0.12 ? 'v-warn' : 'v-ok'}" style="margin-top:12px">
      Базовая норма плана — ${nf(base.kcal)} ккал. Ваша — ${nf(n.kcal)}, это ${scaleOf(who) >= 1 ? '+' : '−'}${Math.abs(Math.round((scaleOf(who) - 1) * 100))}%. На столько же пересчитаны все навески в меню.</p>`
    : '<p class="verdict v-warn" style="margin-top:12px">Заполните возраст, рост и вес — без них формула не считает. Пока действует базовая норма плана: ' + nf(base.kcal) + ' ккал.</p>'}
  </div>
  ${hist.length ? `<div class="card sec">
    <div class="sec-h"><h2>Журнал веса</h2><span class="lbl">${hist.length} ${hist.length === 1 ? 'запись' : hist.length < 5 ? 'записи' : 'записей'}</span></div>
    ${trend ? `<p class="verdict v-ok" style="margin-bottom:12px">${esc(trend)}</p>` : ''}
    <div class="hist">${hist.map((x, i) => {
      const prev = hist[i + 1];
      const d = prev ? x.wt - prev.wt : 0;
      return `<div class="hist-row"><span class="d">${fmt(x.d)}</span>
        <span class="dt">${String(x.wt).replace('.', ',')} кг</span>
        <b class="${d < 0 ? 'dn' : d > 0 ? 'up' : ''}">${prev ? (d > 0 ? '+' : d < 0 ? '−' : '') + (d ? Math.abs(d).toFixed(1).replace('.', ',') : '0') + ' кг' : 'старт'}</b></div>`;
    }).join('')}</div>
    <p class="lead" style="font-size:12.5px;margin-top:12px">Взвешивайтесь раз в неделю утром натощак и записывайте сюда. Норма пересчитывается сразу, а формула — только гипотеза с разбросом ±15%: последнее слово всегда за динамикой на весах.</p>
  </div>` : ''}`;
}

    </div>
  </div>`;

function pageSearch(){
  const R = searchAll(query);
  if(!R) return `<div class="card sec"><p class="empty"><b>Введите хотя бы две буквы</b>Поиск идёт по блюдам недели, навескам, рецептам, перекусам и списку покупок.</p></div>`;
  if(!R.total) return `<div class="card sec"><p class="empty"><b>Ничего не нашлось</b>По запросу «${esc(query)}» совпадений нет. Попробуйте часть слова — например «гриб» вместо «шампиньоны».</p></div>`;
  const head = (t,n) => `<div class="res-h"><h3>${t}</h3><span class="c">${n}</span></div>`;
  let out = `<div class="card sec"><div class="sec-h"><h2>Найдено: ${R.total}</h2><span class="lbl">запрос «${esc(query)}» · порции: ${person(who).name.toLowerCase()}</span></div>`;
  if(R.meals.length){
    out += head('В меню недели', R.meals.length) + '<div class="res-list">' + R.meals.map(({d,di,m}) => {
      const v = m[who];
      return `<button type="button" class="res-row" data-day="${di}">${donut(v.p,v.f,v.c,34,6)}
        <span><h5>${hl(m.title,R.q)}</h5><span class="s">${esc(d.name)} · ${TAGN[m.label]||m.label} · ${hl(v.qty,R.q)}</span></span>
        <span class="kk">${nf(v.k)}</span></button>`;
    }).join('') + '</div>';
  }
  if(R.recipes.length){
    out += head('Рецепты', R.recipes.length) + '<div class="res-list">' + R.recipes.map(({r,ri}) => {
      const ing = r.ing.filter(i => i.n.toLowerCase().includes(R.q)).map(i => i.n);
      return `<button type="button" class="res-row" data-recipe="${ri}">${donut(r.per100.p,r.per100.f,r.per100.c,34,6)}
        <span><h5>${hl(r.title,R.q)}</h5><span class="s">${esc(r.gear)}${ing.length?' · в навеске: '+ing.map(x=>hl(x,R.q)).join(', '):''}</span></span>
        <span class="kk">${r.per100.k}/100 г</span></button>`;
    }).join('') + '</div>';
  }
  for(const [t,list,dest] of [['Перекусы',R.snacks,'snacks'],['Сладкое',R.sweets,'snacks']]){
    if(!list.length) continue;
    out += head(t, list.length) + '<div class="res-list">' + list.map(x =>
      `<button type="button" class="res-row" data-go="${dest}">${donut(x.p,x.f,x.c,34,6)}
        <span><h5>${hl(x.title,R.q)}</h5><span class="s">${hl(x.qty,R.q)}</span></span>
        <span class="kk">${x.k}</span></button>`).join('') + '</div>';
  }
  if(R.shop.length){
    out += head('В списке покупок', R.shop.length) + '<div class="res-list">' + R.shop.map(x =>
      `<button type="button" class="res-row" data-go="shop"><span class="lbl" style="text-align:center">${esc(x.g.slice(0,2))}</span>
        <span><h5>${hl(x.n,R.q)}</h5><span class="s">${esc(x.t)} · ${esc(x.g)}</span></span>
        <span class="kk">${esc(x.amt)}</span></button>`).join('') + '</div>';
  }
  return out + '</div>';
}

function swapPanel(di, mi){
  const O = swapOptions(di, mi);
  const cur = mealView(di, mi);
  let out = '<div class="swp">';
  if(O.dishes.length){
    out += '<div class="swp-g"><span class="lbl">Другое блюдо<i></i></span>' + O.dishes.map(d => {
      const st = stepsFor(d.tpl, d.items);
      return optRow(st && !st.broken ? cap(st.title) : d.tpl.short,
        d.tpl.gear + ' · ' + d.tpl.time, Math.round(d.v.k),
        { di, mi, title: st && !st.broken ? cap(st.title) : d.tpl.short, tplId: d.tpl.id,
          items: d.items.map(x => ({ n:x.n, g:x.g, r:x.r, side:!!x.side })) });
    }).join('') + '</div>';
  }
  if(O.light.length){
    out += '<div class="swp-g"><span class="lbl">Готовое без готовки<i></i></span>' + O.light.map(x =>
      optRow(x.title, qtyText(x.items), Math.round(sumOf(x.items).k),
        { di, mi, title: x.title, items: x.items.map(y => ({ n:y.n, g:y.g })) })).join('') + '</div>';
  }
  if(O.split){
    const items = O.split[0].items.concat(O.split[1].items).map(y => ({ n:y.n, g:y.g }));
    out += '<div class="swp-g"><span class="lbl">Разбить на два поменьше<i></i></span>' +
      optRow(O.split[0].title + ' + ' + O.split[1].title,
             qtyText(O.split[0].items) + ' · ' + qtyText(O.split[1].items),
             Math.round(sumOf(items).k),
             { di, mi, title: O.split[0].title + ' + ' + O.split[1].title, items }) + '</div>';
  }
  const parts = cur.items ? cur.items : parseQty(cur.qty);
  const subLines = parts.map(x => {
    const alts = subsFor(x.n, x.g);
    if(!alts.length) return '';
    return `<div class="subs"><span class="src">Нет под рукой <b>${esc(word(x.n))} ${gOf(x)}</b> — можно взять:</span>` +
      alts.map(al => {
        const next = parts.map(y => y.n === x.n ? { n:al.n, g:al.g, r:y.r, side:!!y.side } : { n:y.n, g:y.g, r:y.r, side:!!y.side });
        return `<button type="button" class="sub-b" data-apply="${esc(JSON.stringify(
          { di, mi, title: cur.title, tplId: cur.tplId || null, items: next }))}">${esc(word(al.n))} <b>${al.g} г</b></button>`;
      }).join('') + '</div>';
  }).filter(Boolean).join('');
  const whole = (cur.qty || '').split(', ').length - parts.length;
  if(subLines || whole > 0){
    out += '<div class="swp-g"><span class="lbl">Нет продукта — чем заменить<i></i></span>' + subLines +
      (whole > 0 ? '<p class="s" style="font-size:11.5px;color:var(--ink3)">Часть приёма — готовое блюдо из заготовок, по продуктам оно не раскладывается. Его состав и замены смотрите в разделе «Рецепты».</p>' : '') + '</div>';
  }
  out += `<div style="display:flex;gap:7px;flex-wrap:wrap">
    <button type="button" class="btn btn-2" data-swapclose="1">Закрыть</button>
    ${cur.swapped ? '<button type="button" class="btn btn-2" data-undo="' + di + '.' + mi + '">Вернуть как в плане</button>' : ''}
    <span class="lbl" style="align-self:center">цель приёма: ${nf(O.aim.k)} ккал · белок ${O.aim.p} г</span>
  </div></div>`;
  return out;
}

function batchDetails(r){
  const rc = RECIPE[r.n]; if(!rc) return '';
  const f = r.g / (rc.outG || 1000);
  return `<details class="sub"><summary>${esc(word(r.n))}: ${Math.round(r.g)} г — это ${Math.round(f * 100)}% закладки</summary>
    <ul class="ing">${rc.ing.map(x => `<li>${esc(x.n)}<span>${Math.round(x.g * f)} г из ${esc(x.txt)}</span></li>`).join('')}</ul>

  </details>`;
}

  </div>`;
}
